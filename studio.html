<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solvrik Pro Studio HD ⚡</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" async></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
  <style>
    :root {
      --bg: #070d19;
      --surface: #11192c;
      --surface-2: #18233c;
      --border: rgba(148, 163, 184, 0.18);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #132240 0%, var(--bg) 55%);
      color: var(--text);
      padding: 14px;
      padding-bottom: 52px;
      min-height: 100vh;
    }

    .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .hdr-title { display: flex; align-items: center; gap: 8px; }
    .hdr-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .hdr h2 { margin: 0; font-size: 16.5px; letter-spacing: -0.2px; }
    .badge {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 700;
    }

    .pbar-wrap { width: 100%; height: 4px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .pbar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); }

    /* Vertical Line-by-Line Stacked Navigation Grid */
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab {
      padding: 11px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
    }
    .tab.active {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .upload-box {
      border: 2px dashed rgba(59, 130, 246, 0.55);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      display: block;
      background: rgba(15, 23, 42, 0.72);
    }
    .upload-box:active { background: rgba(59, 130, 246, 0.12); border-color: #60a5fa; }
    .upload-box b { font-size: 14px; color: #f1f5f9; }
    .upload-box span { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
    input[type="file"] { display: none; }

    .canvas-box {
      position: relative;
      margin-top: 12px;
      background: #040812;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    canvas, img { max-width: 100%; max-height: 380px; display: block; }

    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .col-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; min-width: 110px; padding: 12px 12px;
      border: none; border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff; font-weight: 600; font-size: 13.5px;
      cursor: pointer; text-align: center;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
    }
    .btn.sec { background: var(--surface-2); box-shadow: none; border: 1px solid var(--border); color: #e2e8f0; }
    .btn.green { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 3px 10px rgba(16, 185, 129, 0.28); }
    .btn.sm { flex: 0 0 auto; min-width: 46px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
    .btn:active { transform: scale(0.97); }

    .rot-bar {
      display: flex; align-items: center; gap: 8px;
      background: #0b1222; padding: 8px 10px; border-radius: 12px;
      border: 1px solid var(--border); margin-top: 10px;
    }
    .rot-bar input[type="range"] { flex: 1; margin: 0; accent-color: #3b82f6; }
    .rot-badge { min-width: 46px; text-align: center; font-size: 13px; font-weight: 700; color: #38bdf8; }

    input[type="number"], input[type="text"], select {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: #0b1222;
      color: #fff; font-size: 13.5px; margin-top: 8px; outline: none;
    }

    .pill {
      padding: 7px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #0b1222;
      color: #cbd5e1; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .pill.on { background: var(--accent); border-color: #60a5fa; color: #fff; }

    .hint { font-size: 11.5px; color: #94a3b8; margin-top: 7px; text-align: center; }
    .info { font-size: 13px; color: #38bdf8; margin-top: 8px; font-weight: 600; word-break: break-word; line-height: 1.45; }
    .hidden { display: none !important; }

    #out-box {
      margin-bottom: 14px;
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.14), var(--surface));
      border: 1.5px solid #10b981;
      border-radius: 14px;
      padding: 13px;
      text-align: center;
    }
    #out-box img { margin: 0 auto; border-radius: 9px; max-height: 280px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="hdr-title">
      <div class="hdr-logo">S</div>
      <h2>Solvrik Pro Studio ⚡</h2>
    </div>
    <span class="badge">HD Studio Engine</span>
  </div>
  <div class="pbar-wrap"><div class="pbar-fill"></div></div>

  <!-- STACKED 2-COLUMN TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('crop', this)">✂️ Auto-Crop + Manual ⚡</button>
    <button class="tab" onclick="switchTab('pdf', this)">📑 PDF Ink Saver & PDF ⚡</button>
    <button class="tab" onclick="switchTab('kb', this)">📦 Exact KB / MB Size ⚡</button>
    <button class="tab" onclick="switchTab('pass', this)">🪪 Passport & Exam ⚡</button>
    <button class="tab" onclick="switchTab('fx', this)">🎨 Filters & DP Maker ⚡</button>
    <button class="tab" onclick="switchTab('soc', this)">📱 ID Join • Collage • Sign ⚡</button>
  </div>

  <!-- OUTPUT BOX -->
  <div id="out-box" class="hidden">
    <div id="out-title" style="font-size:13.5px;font-weight:700;color:#34d399;margin-bottom:8px">✅ HD File Ready!</div>
    <img id="out-img" />
    <div id="dl-msg" class="hint" style="color:#cbd5e1;margin-top:8px">
      👇 <b>Save / Share</b> dabayein (ya photo par <b>Hold → Save Image</b> karein):
    </div>
    <div class="row">
      <button class="btn green" onclick="smartSaveAction()">⬇️ Direct Save / Share</button>
      <button class="btn" onclick="openImageTab()">🖼️ Open Full HD</button>
      <button class="btn sec sm" onclick="document.getElementById('out-box').classList.add('hidden')">✖️</button>
    </div>
  </div>

  <!-- 1. HD SUB-PIXEL AUTO-CROP + MANUAL 4-CORNER & -1°/+1° -->
  <div id="tab-crop" class="card">
    <label class="upload-box">
      📸 <b>Card / Document / Photo chunein (Full HD)</b>
      <span>Auto-Crop + Movable Ratio Box + Sub-Pixel Bilinear Warp</span>
      <input type="file" accept="image/*" onchange="loadCrop(event)" />
    </label>
    <div id="crop-ui" class="hidden">
      <div id="auto-crop-status" class="info" style="text-align:center"></div>
      <div class="canvas-box"><canvas id="quad-canvas"></canvas></div>
      <div class="hint">💡 Beech se drag karke box move karein, ya neele dots & −1°/+1° se adjust karein.</div>

      <div class="row">
        <button class="pill on" onclick="runAutoDetectQuad(this)">🤖 Auto-Detect</button>
        <button class="pill" onclick="setQuadRatio(null, this)">Free</button>
        <button class="pill" onclick="setQuadRatio(85.6/54, this)">ID Card</button>
        <button class="pill" onclick="setQuadRatio(1, this)">1:1</button>
        <button class="pill" onclick="setQuadRatio(4/5, this)">4:5</button>
        <button class="pill" onclick="setQuadRatio(16/9, this)">16:9</button>
        <button class="pill" onclick="setQuadRatio(210/297, this)">A4 Doc</button>
      </div>

      <div class="rot-bar">
        <button class="btn sec sm" onclick="nudgeRotate(-1)">−1°</button>
        <input type="range" id="rot-slider" min="-180" max="180" step="1" value="0" oninput="onRotateSlider(this.value)" />
        <button class="btn sec sm" onclick="nudgeRotate(1)">+1°</button>
        <span id="rot-val" class="rot-badge">0°</span>
      </div>

      <div class="row">
        <button class="btn sec" onclick="nudgeRotate(-90)">↺ -90°</button>
        <button class="btn sec" onclick="nudgeRotate(90)">↻ +90°</button>
        <button class="btn sec" onclick="runAutoDetectQuad()">Re-Auto</button>
      </div>
      <div class="row">
        <button class="btn" onclick="exportQuadCrop(false)">✂️ Save HD Color Crop</button>
        <button class="btn green" onclick="exportQuadCrop(true)">📄 Save HD B&W Scan</button>
      </div>
    </div>
  </div>

  <!-- 2. HIGH-DPI PDF INK SAVER, DOC INK SAVER & IMAGES-TO-PDF -->
  <div id="tab-pdf" class="card hidden">
    <label class="upload-box">
      📑 <b>PDF File ya Document Photo(s) chunein</b>
      <span>High-DPI PDF Ink Saver (Shadow Removal + Crisp Text) & Clean PDF</span>
      <input type="file" accept="application/pdf,image/*" multiple onchange="loadPdfOrDoc(event)" />
    </label>
    <div id="pdf-ui" class="hidden">
      <div id="pdf-stat" class="info"></div>
      <div class="col-stack">
        <button class="btn" onclick="runPdfInkSaver(false)">🖨️ Ink Saver — Color HD (Print Ready)</button>
        <button class="btn green" onclick="runPdfInkSaver(true)">🖤 Ink Saver — Crisp B&W HD</button>
        <button class="btn sec" onclick="runMakeCleanPdf()">📄 Merge / Convert to HD PDF</button>
      </div>
      <div id="pdf-progress" class="info" style="color:#34d399"></div>
    </div>
  </div>

  <!-- 3. HIGH-CLARITY EXACT KB / MB COMPRESSOR -->

    <label class="upload-box">
      🖼️ <b>Photo chunein (10 KB se 5 MB tak)</b>
      <span>Max-Resolution Preserving Smart Compression</span>
      <input type="file" accept="image/*" onchange="loadKb(event)" />
    </label>
    <div id="kb-ui" class="hidden">
      <div class="row">
        <button class="pill" onclick="setKb(10)">10 KB</button>
        <button class="pill" onclick="setKb(20)">20 KB</button>
        <button class="pill" onclick="setKb(50)">50 KB</button>
        <button class="pill" onclick="setKb(100)">100 KB</button>
        <button class="pill" onclick="setKb(200)">200 KB</button>
        <button class="pill" onclick="setKb(1024)">1 MB</button>

        <button class="pill" onclick="setKb(5120)">5 MB</button>

      <input type="number" id="kb-val" value="20" min="3" max="15000" placeholder="Target KB likhein (e.g. 20 ya 5120)" />
      <button class="btn" style="width:100%;margin-top:10px" onclick="runKb()">⚡ Compress with Max Clarity</button>
      <div id="kb-stat" class="info"></div>

  <!-- 4. 300-DPI PASSPORT, A4 SHEET & EXAM PRESETS -->

    <label class="upload-box">
      🪪 <b>Selfie / Portrait / Signature chunein</b>

        <option value="a4_12">A4 Print Sheet — 12 Photos (2 Rows, 300 DPI)</option>
        <option value="a4_30">A4 Print Sheet — 30 Photos (5 Rows, 300 DPI)</option>
        <option value="ssc">SSC / Bank / Railway Preset (20–50 KB)</option>
        <option value="upsc">UPSC Preset (Square 500×500, ≤180 KB)</option>
        <option value="jee">JEE / NEET Preset (35×45mm, ≤95 KB)</option>
        <option value="sign">Exam Signature Preset (280×120, ≤18 KB)</option>
      </select>
      <input type="text" id="pass-label" oninput="renderPassPreview()" placeholder="Optional Name | Date (e.g. Amit Kumar | 28/11/2026)" />
      <button class="btn green" style="width:100%;margin-top:10px" onclick="exportPassport()">🪪 Generate Studio HD Output</button>
    </div>
  </div>

  <!-- 5. FULL-RES FILTERS, SHARPEN & DP MAKER -->
  <div id="tab-fx" class="card hidden">
    <label class="upload-box">
      🎨 <b>Photo chunein (Full-Res Enhance & DP Maker)</b>
      <span>Zero Resolution Loss — Exports Full Original HD Size</span>
      <input type="file" accept="image/*" onchange="loadFx(event)" />
    </label>
    <div id="fx-ui" class="hidden">
      <div class="canvas-box"><canvas id="fx-canvas"></canvas></div>
      <div class="row">
        <button class="pill" onclick="applyFx('orig')">Original</button>
        <button class="pill" onclick="applyFx('enhance')">✨ Auto HD</button>
        <button class="pill" onclick="applyFx('sharp')">🔍 Crisp Sharp</button>
        <button class="pill" onclick="applyFx('bw')">⚫ B&W</button>
        <button class="pill" onclick="applyFx('vintage')">🎞️ Vintage</button>
        <button class="pill" onclick="applyFx('blur')">💧 Blur</button>
      </div>
      <div class="row">
        <button class="pill" onclick="applyFx('wborder')">⬜ White Border</button>
        <button class="pill" onclick="applyFx('bborder')">⬛ Black Border</button>
        <button class="pill" onclick="applyFx('nocrop')">🖼️ No-Crop DP</button>
        <button class="pill" onclick="applyFx('circle')">🔵 Circular DP</button>
      </div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="saveFx()">✅ Export Full HD Result</button>
    </div>
  </div>

  <!-- 6. HD ID JOIN, COLLAGE, TRANSPARENT SIGN & RESIZE -->
  <div id="tab-soc" class="card hidden">
    <label class="upload-box">
      🪪 <b>1 ya 2–4 Photos chunein (Multi-Select)</b>
      <span>HD ID Front+Back Join, Collage, Transparent Sign PNG & Resize</span>
      <input type="file" accept="image/*" multiple onchange="loadMultiSoc(event)" />
    </label>
    <div id="soc-ui" class="hidden">
      <div id="soc-count" class="info"></div>
      <div class="col-stack">
        <button class="btn" onclick="runIdJoin()">🪪 Join ID Card Front + Back (HD)</button>
        <button class="btn green" onclick="runCollage()">🖼️ Make HD Collage (2–4 Photos)</button>
        <button class="btn sec" onclick="runTransSign()">✍️ Clean Transparent Signature PNG</button>
        <button class="btn sec" onclick="runSticker()">🎭 Telegram Sticker (512px WEBP)</button>
      </div>
      <div class="row">
        <input type="number" id="rs-w" placeholder="Width px" style="flex:1;margin-top:0" />
        <input type="number" id="rs-h" placeholder="Height px" style="flex:1;margin-top:0" />
        <button class="btn sec" style="min-width:85px" onclick="runCustomResize()">📐 Resize</button>
      </div>
      <div class="row">
        <input type="text" id="wm-text" placeholder="Watermark text (@SolvrikHQ)" style="flex:2;margin-top:0" />
        <button class="btn sec" style="min-width:85px" onclick="runWatermark()">💧 Stamp</button>
      </div>
    </div>
  </div>

  <script>
    let lastBlob = null, lastDataUrl = '', lastFilename = 'solvrik_hd.jpg', lastIsPdf = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram?.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
      }
    });

    function switchTab(id, btn) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['crop', 'pdf', 'kb', 'pass', 'fx', 'soc'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== id));
    }

    // Subtle Unsharp-Mask sharpening to make cropped/resized documents & photos crisp
    function sharpenCanvas(canvas, amount = 0.28) {
      const w = canvas.width, h = canvas.height;
      if (w < 40 || h < 40) return canvas;
      const ctx = canvas.getContext('2d');
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const copy = new Uint8ClampedArray(d);
      const stride = w * 4;
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * stride + x * 4;
          for (let c = 0; c < 3; c++) {
            const center = copy[i + c] * 5;
            const neighbors = copy[i - 4 + c] + copy[i + 4 + c] + copy[i - stride + c] + copy[i + stride + c];
            const sharp = center - neighbors;
            d[i + c] = Math.max(0, Math.min(255, copy[i + c] * (1 - amount) + sharp * amount));
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    // Progressive 2x step-downscaling for Lanczos-like crispness
    function progressiveResize(src, targetW, targetH) {
      let cur = document.createElement('canvas');
      cur.width = src.width; cur.height = src.height;
      const c0 = cur.getContext('2d');
      c0.imageSmoothingEnabled = true; c0.imageSmoothingQuality = 'high';
      c0.drawImage(src, 0, 0);

      while (cur.width * 0.5 > targetW && cur.height * 0.5 > targetH) {
        const nxt = document.createElement('canvas');
        nxt.width = Math.round(cur.width * 0.5);
        nxt.height = Math.round(cur.height * 0.5);
        const nctx = nxt.getContext('2d');
        nctx.imageSmoothingEnabled = true; nctx.imageSmoothingQuality = 'high';
        nctx.drawImage(cur, 0, 0, nxt.width, nxt.height);
        cur = nxt;
      }
      const out = document.createElement('canvas');
      out.width = targetW; out.height = targetH;
      const octx = out.getContext('2d');
      octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high';
      octx.drawImage(cur, 0, 0, targetW, targetH);
      return out;
    }

    function setOutput(blob, filename, titleText, previewDataUrl) {
      if (!blob) return;
      lastBlob = blob;
      lastFilename = filename || 'solvrik_hd.jpg';
      lastIsPdf = lastFilename.toLowerCase().endsWith('.pdf');
      const box = document.getElementById('out-box');
      const imgEl = document.getElementById('out-img');
      document.getElementById('out-title').textContent = titleText || `✅ HD Ready: ${lastFilename} (${(blob.size / 1024).toFixed(1)} KB)`;

      if (previewDataUrl) {
        lastDataUrl = previewDataUrl;
        imgEl.src = previewDataUrl;
        imgEl.classList.remove('hidden');
        box.classList.remove('hidden');
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      } else {
        const reader = new FileReader();
        reader.onloadend = () => {
          lastDataUrl = reader.result;
          if (lastIsPdf) imgEl.classList.add('hidden');
          else { imgEl.src = lastDataUrl; imgEl.classList.remove('hidden'); }
          box.classList.remove('hidden');
          box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
        reader.readAsDataURL(blob);
      }
    }

    async function smartSaveAction() {
      if (!lastBlob) return;
      try {
        const file = new File([lastBlob], lastFilename, { type: lastBlob.type || 'application/octet-stream' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: lastFilename });
          return;
        }
      } catch (e) {}

      try {
        const url = lastIsPdf ? URL.createObjectURL(lastBlob) : (lastDataUrl || URL.createObjectURL(lastBlob));
        const a = document.createElement('a');
        a.href = url; a.download = lastFilename;
        document.body.appendChild(a); a.click();
        setTimeout(() => a.remove(), 250);
      } catch (e) {}

      if (!lastIsPdf) openImageTab();
    }

    function openImageTab() {
      if (!lastBlob) return;
      const url = lastIsPdf ? URL.createObjectURL(lastBlob) : (lastDataUrl || URL.createObjectURL(lastBlob));
      window.open(url, '_blank');
    }

    // ================= 1. HD AUTO-CROP + SUB-PIXEL BILINEAR WARP + -1°/+1° =================
    let rawCropImg = null, rotCanvas = document.createElement('canvas'), rotAngle = 0;
    let quadPts = [], activePt = -1, isDraggingBox = false, dragStart = { x: 0, y: 0 }, dragOrigPts = [];

    function loadCrop(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => {
        rawCropImg = im; rotAngle = 0;
        document.getElementById('rot-slider').value = 0;
        document.getElementById('rot-val').textContent = '0°';
        document.getElementById('crop-ui').classList.remove('hidden');
        rebuildRotatedBase(true);
      };
      im.src = URL.createObjectURL(f);
    }

    function onRotateSlider(val) {
      rotAngle = Math.max(-180, Math.min(180, parseInt(val, 10) || 0));
      document.getElementById('rot-val').textContent = rotAngle + '°';
      rebuildRotatedBase(false);
    }

    function nudgeRotate(delta) {
      let next = rotAngle + delta;
      if (next > 180) next -= 360;
      if (next < -180) next += 360;
      rotAngle = next;
      document.getElementById('rot-slider').value = rotAngle;
      document.getElementById('rot-val').textContent = rotAngle + '°';
      rebuildRotatedBase(Math.abs(delta) >= 90);
    }

    function autoDetectBoxOnCanvas(canvas) {
      const sw = 200, sh = Math.max(80, Math.round(canvas.height * (sw / canvas.width)));
      const tmp = document.createElement('canvas'); tmp.width = sw; tmp.height = sh;
      const ctx = tmp.getContext('2d'); ctx.drawImage(canvas, 0, 0, sw, sh);
      const px = ctx.getImageData(0, 0, sw, sh).data;

      const corners = [], pad = 10;
      for (let y = 0; y < pad; y++) {
        for (let x = 0; x < pad; x++) {
          [[x, y], [sw - 1 - x, y], [x, sh - 1 - y], [sw - 1 - x, sh - 1 - y]].forEach(([cx, cy]) => {
            const idx = (cy * sw + cx) * 4;
            corners.push([px[idx], px[idx + 1], px[idx + 2]]);
          });
        }
      }

      let minX = sw, minY = sh, maxX = 0, maxY = 0, hits = 0;
      for (let y = 4; y < sh - 4; y++) {
        for (let x = 4; x < sw - 4; x++) {
          const i = (y * sw + x) * 4;
          const r = px[i], g = px[i + 1], b = px[i + 2];
          let minD = 999999;
          for (let k = 0; k < corners.length; k += 4) {
            const dr = r - corners[k][0], dg = g - corners[k][1], db = b - corners[k][2];
            const d = dr * dr + dg * dg + db * db;
            if (d < minD) minD = d;
          }
          const isBlueCard = (b > r + 18 && b > 70);
          const isWhitePaper = (r > 185 && g > 185 && b > 185 && Math.abs(r - b) < 25);
          if (minD > 3200 || isBlueCard || isWhitePaper) {
            hits++;
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }

      const bw = maxX - minX, bh = maxY - minY, areaRatio = (bw * bh) / (sw * sh);
      if (hits > 60 && areaRatio >= 0.08 && areaRatio <= 0.88) {
        const sx = canvas.width / sw, sy = canvas.height / sh;
        return {
          x1: Math.max(8, minX * sx), y1: Math.max(8, minY * sy),
          x2: Math.min(canvas.width - 8, maxX * sx), y2: Math.min(canvas.height - 8, maxY * sy),
          detected: true
        };
      }
      return { x1: canvas.width * 0.14, y1: canvas.height * 0.18, x2: canvas.width * 0.86, y2: canvas.height * 0.82, detected: false };
    }

    function runAutoDetectQuad(btnEl) {
      if (btnEl) {
        document.querySelectorAll('#tab-crop .pill').forEach(p => p.classList.remove('on'));
        btnEl.classList.add('on');
      }
      const box = autoDetectBoxOnCanvas(rotCanvas);
      quadPts = [
        { x: box.x1, y: box.y1 }, { x: box.x2, y: box.y1 },
        { x: box.x2, y: box.y2 }, { x: box.x1, y: box.y2 }
      ];
      document.getElementById('auto-crop-status').textContent = box.detected
        ? '🤖 Auto-Crop Applied! Satisfied hon toh Save dabayein, warna corners se adjust karein:'
        : '✂️ Manual Box Ready — 4 corners ko card/page ke konon par set karein:';
      drawQuadOverlay();
    }

    function setQuadRatio(ratio, btnEl) {
      if (btnEl) {
        document.querySelectorAll('#tab-crop .pill').forEach(p => p.classList.remove('on'));
        btnEl.classList.add('on');
      }
      const w = rotCanvas.width, h = rotCanvas.height;
      if (!ratio) {
        quadPts = [{ x: w * 0.14, y: h * 0.18 }, { x: w * 0.86, y: h * 0.18 }, { x: w * 0.86, y: h * 0.82 }, { x: w * 0.14, y: h * 0.82 }];
      } else {
        let rw = w * 0.78, rh = rw / ratio;
        if (rh > h * 0.78) { rh = h * 0.78; rw = rh * ratio; }
        const x1 = (w - rw) / 2, y1 = (h - rh) / 2;
        quadPts = [{ x: x1, y: y1 }, { x: x1 + rw, y: y1 }, { x: x1 + rw, y: y1 + rh }, { x: x1, y: y1 + rh }];
      }
      drawQuadOverlay();
    }

    function rebuildRotatedBase(runAuto) {
      if (!rawCropImg) return;
      // Preserve up to 2400px Full HD resolution
      const maxDim = 2400;
      const s = Math.min(1, maxDim / Math.max(rawCropImg.width, rawCropImg.height));
      const sw = Math.round(rawCropImg.width * s), sh = Math.round(rawCropImg.height * s);
      const rad = rotAngle * Math.PI / 180;
      const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
      const nw = Math.round(sw * cos + sh * sin), nh = Math.round(sw * sin + sh * cos);

      rotCanvas.width = nw; rotCanvas.height = nh;
      const ctx = rotCanvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#040812'; ctx.fillRect(0, 0, nw, nh);
      ctx.save(); ctx.translate(nw / 2, nh / 2); ctx.rotate(rad);
      ctx.drawImage(rawCropImg, -sw / 2, -sh / 2, sw, sh);
      ctx.restore();

      if (runAuto || quadPts.length !== 4) runAutoDetectQuad();
      else {
        quadPts.forEach(p => { p.x = Math.min(nw - 4, Math.max(4, p.x)); p.y = Math.min(nh - 4, Math.max(4, p.y)); });
        drawQuadOverlay();
      }
    }

    function pointInQuad(px, py, pts) {
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
        const intersect = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-6) + xi);
        if (intersect) inside = !inside;
      }
      return inside;
    }

    function drawQuadOverlay() {
      const qc = document.getElementById('quad-canvas');
      qc.width = rotCanvas.width; qc.height = rotCanvas.height;
      const ctx = qc.getContext('2d');
      ctx.drawImage(rotCanvas, 0, 0);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
      ctx.beginPath(); ctx.rect(0, 0, qc.width, qc.height);
      ctx.moveTo(quadPts[0].x, quadPts[0].y);
      for (let i = 3; i >= 0; i--) ctx.lineTo(quadPts[i].x, quadPts[i].y);
      ctx.closePath(); ctx.fill('evenodd'); ctx.restore();

      ctx.strokeStyle = isDraggingBox ? '#10b981' : '#38bdf8';
      ctx.lineWidth = Math.max(3, qc.width / 240);
      ctx.beginPath(); ctx.moveTo(quadPts[0].x, quadPts[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(quadPts[i].x, quadPts[i].y);
      ctx.closePath(); ctx.stroke();

      const cx = (quadPts[0].x + quadPts[1].x + quadPts[2].x + quadPts[3].x) / 4;
      const cy = (quadPts[0].y + quadPts[1].y + quadPts[2].y + quadPts[3].y) / 4;
      const gr = Math.max(20, qc.width / 34);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
      ctx.beginPath(); ctx.arc(cx, cy, gr, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(gr * 1.1)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('✥', cx, cy);

      const r = Math.max(18, qc.width / 36);
      quadPts.forEach((pt, idx) => {
        ctx.fillStyle = idx === activePt ? '#10b981' : '#3b82f6';
        ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
      });
    }

    (function bindQuadTouch() {
      const qc = document.getElementById('quad-canvas');
      function getPos(ev) {
        const rect = qc.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev;
        return { x: (t.clientX - rect.left) * (qc.width / rect.width), y: (t.clientY - rect.top) * (qc.height / rect.height) };
      }
      function down(ev) {
        if (quadPts.length !== 4) return;
        const p = getPos(ev), hitR = Math.max(42, qc.width / 12);
        let best = -1, bestD = hitR;
        quadPts.forEach((pt, i) => { const d = Math.hypot(pt.x - p.x, pt.y - p.y); if (d < bestD) { bestD = d; best = i; } });
        if (best !== -1) { activePt = best; isDraggingBox = false; ev.preventDefault(); drawQuadOverlay(); return; }
        if (pointInQuad(p.x, p.y, quadPts)) {
          isDraggingBox = true; dragStart = p;
          dragOrigPts = quadPts.map(pt => ({ x: pt.x, y: pt.y }));
          ev.preventDefault(); drawQuadOverlay();
        }
      }
      function move(ev) {
        if (activePt !== -1) {
          ev.preventDefault();
          const p = getPos(ev);
          quadPts[activePt].x = Math.max(0, Math.min(qc.width, p.x));
          quadPts[activePt].y = Math.max(0, Math.min(qc.height, p.y));
          drawQuadOverlay(); return;
        }
        if (isDraggingBox) {
          ev.preventDefault();
          const p = getPos(ev);
          let dx = p.x - dragStart.x, dy = p.y - dragStart.y;
          const minX = Math.min(...dragOrigPts.map(pt => pt.x)), maxX = Math.max(...dragOrigPts.map(pt => pt.x));
          const minY = Math.min(...dragOrigPts.map(pt => pt.y)), maxY = Math.max(...dragOrigPts.map(pt => pt.y));
          dx = Math.max(-minX, Math.min(qc.width - maxX, dx));
          dy = Math.max(-minY, Math.min(qc.height - maxY, dy));
          quadPts = dragOrigPts.map(pt => ({ x: pt.x + dx, y: pt.y + dy }));
          drawQuadOverlay();
        }
      }
      function up() { if (activePt !== -1 || isDraggingBox) { activePt = -1; isDraggingBox = false; drawQuadOverlay(); } }
      qc.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
      qc.addEventListener('touchstart', down, { passive: false }); window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
    })();

    // Sub-Pixel Bilinear Perspective Warp + Clarity Sharpening (Zero Pixelation)
    function exportQuadCrop(bwMode) {
      if (quadPts.length !== 4) return;
      const sortedY = [...quadPts].sort((a, b) => a.y - b.y);
      const top = sortedY.slice(0, 2).sort((a, b) => a.x - b.x);
      const bot = sortedY.slice(2, 4).sort((a, b) => a.x - b.x);
      const tl = top[0], tr = top[1], br = bot[1], bl = bot[0];

      const outW = Math.max(160, Math.round(Math.max(Math.hypot(tr.x - tl.x, tr.y - tl.y), Math.hypot(br.x - bl.x, br.y - bl.y))));
      const outH = Math.max(160, Math.round(Math.max(Math.hypot(bl.x - tl.x, bl.y - tl.y), Math.hypot(br.x - tr.x, br.y - tr.y))));

      const sPx = rotCanvas.getContext('2d').getImageData(0, 0, rotCanvas.width, rotCanvas.height).data;
      const sw = rotCanvas.width, sh = rotCanvas.height, stride = sw * 4;
      const outCanvas = document.createElement('canvas'); outCanvas.width = outW; outCanvas.height = outH;
      const outCtx = outCanvas.getContext('2d'), outImg = outCtx.createImageData(outW, outH), dPx = outImg.data;

      for (let y = 0; y < outH; y++) {
        const v = y / (outH - 1);
        const lx = tl.x + (bl.x - tl.x) * v, ly = tl.y + (bl.y - tl.y) * v;
        const rx = tr.x + (br.x - tr.x) * v, ry = tr.y + (br.y - tr.y) * v;
        for (let x = 0; x < outW; x++) {
          const u = x / (outW - 1);
          const fx = Math.min(sw - 1.001, Math.max(0, lx + (rx - lx) * u));
          const fy = Math.min(sh - 1.001, Math.max(0, ly + (ry - ly) * u));
          const x0 = fx | 0, y0 = fy | 0;
          const dx = fx - x0, dy = fy - y0;
          const w00 = (1 - dx) * (1 - dy), w10 = dx * (1 - dy), w01 = (1 - dx) * dy, w11 = dx * dy;

          const i00 = y0 * stride + x0 * 4;
          const i10 = i00 + 4;
          const i01 = i00 + stride;
          const i11 = i01 + 4;

          const r = sPx[i00] * w00 + sPx[i10] * w10 + sPx[i01] * w01 + sPx[i11] * w11;
          const g = sPx[i00 + 1] * w00 + sPx[i10 + 1] * w10 + sPx[i01 + 1] * w01 + sPx[i11 + 1] * w11;
          const b = sPx[i00 + 2] * w00 + sPx[i10 + 2] * w10 + sPx[i01 + 2] * w01 + sPx[i11 + 2] * w11;

          const di = (y * outW + x) * 4;
          if (bwMode) {
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;
            const val = lum > 142 ? 255 : Math.max(0, (lum - 32) * 1.45);
            dPx[di] = dPx[di + 1] = dPx[di + 2] = val;
          } else {
            dPx[di] = r; dPx[di + 1] = g; dPx[di + 2] = b;
          }
          dPx[di + 3] = 255;
        }
      }
      outCtx.putImageData(outImg, 0, 0);
      sharpenCanvas(outCanvas, 0.26);
      outCanvas.toBlob(b => setOutput(b, bwMode ? 'solvrik_hd_scan.jpg' : 'solvrik_hd_crop.jpg', `✅ HD ${outW}×${outH} px Ready!`), 'image/jpeg', 0.97);
    }

    // ================= 2. HIGH-DPI PDF INK SAVER + IMAGE INK SAVER =================
    let pdfSourceFiles = [];
    function loadPdfOrDoc(e) {
      pdfSourceFiles = Array.from(e.target.files || []);
      if (!pdfSourceFiles.length) return;
      document.getElementById('pdf-ui').classList.remove('hidden');
      document.getElementById('pdf-stat').textContent = `📁 Selected: ${pdfSourceFiles.length} file(s) — ${pdfSourceFiles[0].name}`;
      document.getElementById('pdf-progress').textContent = '';
    }

    function applyInkSaverToCanvas(srcCanvas, bwMode) {
      const w = srcCanvas.width, h = srcCanvas.height;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.drawImage(srcCanvas, 0, 0, w, h);
      const srcData = ctx.getImageData(0, 0, w, h), px = srcData.data;

      let lumSum = 0;
      for (let i = 0; i < px.length; i += 16) lumSum += (px[i] + px[i + 1] + px[i + 2]) / 3;
      if ((lumSum / (px.length / 16)) < 95) {
        for (let i = 0; i < px.length; i += 4) {
          px[i] = 255 - px[i]; px[i + 1] = 255 - px[i + 1]; px[i + 2] = 255 - px[i + 2];
        }
        ctx.putImageData(srcData, 0, 0);
      }

      const bgC = document.createElement('canvas');
      const bw = Math.max(40, Math.round(w / 14)), bh = Math.max(40, Math.round(h / 14));
      bgC.width = bw; bgC.height = bh;
      const bgCtx = bgC.getContext('2d'); bgCtx.filter = 'blur(4px)'; bgCtx.drawImage(c, 0, 0, bw, bh);

      const upBg = document.createElement('canvas'); upBg.width = w; upBg.height = h;
      const upCtx = upBg.getContext('2d'); upCtx.filter = 'blur(14px)'; upCtx.drawImage(bgC, 0, 0, w, h);
      const bgPx = upCtx.getImageData(0, 0, w, h).data;

      for (let i = 0; i < px.length; i += 4) {
        let r = Math.min(255, (px[i] / Math.max(40, bgPx[i])) * 246);
        let g = Math.min(255, (px[i + 1] / Math.max(40, bgPx[i + 1])) * 246);
        let b = Math.min(255, (px[i + 2] / Math.max(40, bgPx[i + 2])) * 246);

        r = Math.max(0, Math.min(255, (r - 128) * 1.42 + 145));
        g = Math.max(0, Math.min(255, (g - 128) * 1.42 + 145));
        b = Math.max(0, Math.min(255, (b - 128) * 1.42 + 145));

        const lum = 0.299 * r + 0.587 * g + 0.114 * b;
        if (lum > 202) {
          px[i] = px[i + 1] = px[i + 2] = 255;
        } else if (bwMode) {
          const v = lum > 155 ? 255 : Math.max(0, lum * 0.68);
          px[i] = px[i + 1] = px[i + 2] = v;
        } else {
          px[i] = Math.round(r * 0.84); px[i + 1] = Math.round(g * 0.84); px[i + 2] = Math.round(b * 0.84);
        }
      }
      ctx.putImageData(srcData, 0, 0);
      return sharpenCanvas(c, 0.25);
    }

    async function extractCanvasesFromFiles(files, progEl) {
      const canvases = [];
      for (const f of files) {
        if (f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')) {
          if (!window.pdfjsLib) throw new Error('PDF engine load ho raha hai, 2 sec baad try karein.');
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const arrBuf = await f.arrayBuffer();
          const pdf = await window.pdfjsLib.getDocument({ data: arrBuf }).promise;
          const total = Math.min(pdf.numPages, 25);
          for (let p = 1; p <= total; p++) {
            if (progEl) progEl.textContent = `⏳ Rendering HD PDF Page ${p} / ${total}...`;
            const page = await pdf.getPage(p);
            const vp = page.getViewport({ scale: 2.1 });
            const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
            await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
            canvases.push(c);
          }
        } else {
          const im = await new Promise((res, rej) => {
            const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(f);
          });
          const s = Math.min(1, 2400 / Math.max(im.width, im.height));
          canvases.push(progressiveResize(im, Math.round(im.width * s), Math.round(im.height * s)));
        }
      }
      return canvases;
    }

    async function runPdfInkSaver(bwMode) {
      if (!pdfSourceFiles.length) return;
      const prog = document.getElementById('pdf-progress');
      try {
        const rawPages = await extractCanvasesFromFiles(pdfSourceFiles, prog);
        const cleaned = [];
        for (let i = 0; i < rawPages.length; i++) {
          prog.textContent = `🖨️ HD Ink Saver page ${i + 1} / ${rawPages.length}...`;
          cleaned.push(applyInkSaverToCanvas(rawPages[i], bwMode));
        }
        if (cleaned.length === 1 && !pdfSourceFiles[0].name.toLowerCase().endsWith('.pdf')) {
          cleaned[0].toBlob(b => {
            prog.textContent = '✅ HD Ink Saver Image Ready!';
            setOutput(b, bwMode ? 'solvrik_ink_saver_bw.jpg' : 'solvrik_ink_saver_color.jpg');
          }, 'image/jpeg', 0.96);
          return;
        }
        if (!window.jspdf) throw new Error('PDF writer load ho raha hai.');
        const { jsPDF } = window.jspdf;
        let doc = null;
        cleaned.forEach((c, idx) => {
          const orient = c.width > c.height ? 'l' : 'p';
          if (idx === 0) doc = new jsPDF({ orientation: orient, unit: 'px', format: [c.width, c.height] });
          else doc.addPage([c.width, c.height], orient);
          doc.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, c.width, c.height);
        });
        const pdfBlob = doc.output('blob');
        prog.textContent = `✅ HD Ink Saver PDF Ready (${cleaned.length} pages)!`;
        setOutput(pdfBlob, 'solvrik_ink_saver_hd.pdf', `✅ HD Ink Saver PDF (${cleaned.length} pages)`, cleaned[0].toDataURL('image/jpeg', 0.9));
      } catch (err) { prog.textContent = '❌ ' + err.message; }
    }

    async function runMakeCleanPdf() {
      if (!pdfSourceFiles.length) return;
      const prog = document.getElementById('pdf-progress');
      try {
        const pages = await extractCanvasesFromFiles(pdfSourceFiles, prog);

    // ================= 3. HIGH-CLARITY EXACT KB / MB COMPRESSOR =================
    let kbImg = null;
    function setKb(v) { document.getElementById('kb-val').value = v; runKb(); }
    function loadKb(e) {
      const f = e.target.files[0]; if (!f) return;

    // Keeps maximum possible resolution & sharpness while hitting exact byte ceiling
    async function compressImageMaxClarity(imgOrCanvas, targetBytes) {
      let w = imgOrCanvas.width, h = imgOrCanvas.height;
      const maxStart = targetBytes < 40 * 1024 ? 1100 : (targetBytes < 150 * 1024 ? 1600 : 2800);
      if (Math.max(w, h) > maxStart) {
        const s = maxStart / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }

      let best = null, bq = 0.92;
      for (let s = 0; s < 10; s++) {
        const c = progressiveResize(imgOrCanvas, w, h);
        sharpenCanvas(c, 0.22);
        // Try high quality range first (0.55 -> 0.98) before shrinking dimensions
        let lo = 0.55, hi = 0.98;
        for (let i = 0; i < 6; i++) {
          const mid = (lo + hi) / 2;
          const b = await new Promise(r => c.toBlob(r, 'image/jpeg', mid));
          if (b.size <= targetBytes) { best = b; bq = mid; lo = mid; } else { hi = mid; }
        }
        if (best) return { blob: best, w, h, q: bq };
        w = Math.max(240, Math.round(w * 0.82));
        h = Math.max(240, Math.round(h * 0.82));
      }

      const fallbackC = progressiveResize(imgOrCanvas, w, h);
      const fb = await new Promise(r => fallbackC.toBlob(r, 'image/jpeg', 0.35));
      return { blob: fb, w, h, q: 0.35 };
    }

    async function runKb() {
      if (!kbImg) return;
      const targetKb = Math.max(3, parseFloat(document.getElementById('kb-val').value || 20));
      const res = await compressImageMaxClarity(kbImg, targetKb * 1024);
      document.getElementById('kb-stat').textContent = `✅ High-Clarity Ready: ${(res.blob.size / 1024).toFixed(1)} KB | ${res.w}×${res.h} px | Q${Math.round(res.q * 100)}%`;
      setOutput(res.blob, `solvrik_${Math.round(targetKb)}kb_hd.jpg`);
    }

    // ================= 4. 300-DPI PASSPORT, A4 SHEET & EXAM PRESETS =================
    let passImg = null;
    function loadPass(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { passImg = im; document.getElementById('pass-ui').classList.remove('hidden'); renderPassPreview(); };
      im.src = URL.createObjectURL(f);
    }
    function buildPassportTile() {
      const mode = document.getElementById('pass-mode').value;
      const label = document.getElementById('pass-label').value.trim();
      const pw = mode === 'upsc' ? 600 : (mode === 'sign' ? 320 : 413);
      const ph = mode === 'upsc' ? 600 : (mode === 'sign' ? 140 : 531);

      const tile = document.createElement('canvas');
      const hasLabel = label && mode !== 'sign' && mode !== 'upsc';
      tile.width = pw + 6; tile.height = (hasLabel ? ph + 84 : ph) + 6;
      const ctx = tile.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#222'; ctx.fillRect(0, 0, tile.width, tile.height);
      ctx.fillStyle = '#fff'; ctx.fillRect(3, 3, tile.width - 6, tile.height - 6);

      const targetRatio = pw / ph, imgRatio = passImg.width / passImg.height;
      let sx = 0, sy = 0, sw = passImg.width, sh = passImg.height;
      if (imgRatio > targetRatio) { sw = Math.round(sh * targetRatio); sx = Math.round((passImg.width - sw) / 2); }
      else { sh = Math.round(sw / targetRatio); sy = Math.round((passImg.height - sh) * 0.25); }

      const cropTmp = document.createElement('canvas'); cropTmp.width = sw; cropTmp.height = sh;
      cropTmp.getContext('2d').drawImage(passImg, sx, sy, sw, sh, 0, 0, sw, sh);
      const crispPhoto = progressiveResize(cropTmp, pw, ph);
      sharpenCanvas(crispPhoto, 0.22);
      ctx.drawImage(crispPhoto, 3, 3);

      if (hasLabel) {
        ctx.fillStyle = '#000'; ctx.fillRect(3, ph + 3, pw, 2);
        const parts = label.split('|').map(s => s.trim());
        ctx.font = 'bold 23px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(parts[0].slice(0, 24), tile.width / 2, ph + 36);
        if (parts[1]) { ctx.font = '19px sans-serif'; ctx.fillText(parts[1].slice(0, 24), tile.width / 2, ph + 66); }
      }
      return tile;
    }
    function renderPassPreview() {
      if (!passImg) return;
      const tile = buildPassportTile(), pc = document.getElementById('pass-canvas');
      pc.width = tile.width; pc.height = tile.height; pc.getContext('2d').drawImage(tile, 0, 0);
    }
    async function exportPassport() {
      if (!passImg) return;
      const mode = document.getElementById('pass-mode').value, tile = buildPassportTile();
      if (mode === 'sign' || mode === 'upsc' || mode === 'ssc' || mode === 'jee') {
        const maxKb = mode === 'sign' ? 18 : (mode === 'upsc' ? 180 : (mode === 'jee' ? 95 : 45));
        const res = await compressImageMaxClarity(tile, maxKb * 1024);
        setOutput(res.blob, `${mode}_hd_ready.jpg`); return;
      }
      if (mode === 'single') { tile.toBlob(b => setOutput(b, 'passport_300dpi_hd.jpg'), 'image/jpeg', 0.98); return; }
      const rows = mode === 'a4_6' ? 1 : (mode === 'a4_12' ? 2 : 5), cols = 6;
      const a4 = document.createElement('canvas'); a4.width = 2480; a4.height = 3508;
      const actx = a4.getContext('2d'); actx.imageSmoothingEnabled = true; actx.imageSmoothingQuality = 'high';
      actx.fillStyle = '#fff'; actx.fillRect(0, 0, 2480, 3508);
      const tw = 375, th = Math.round(tw * tile.height / tile.width), gap = 24;
      const sx = Math.round((2480 - (cols * tw + (cols - 1) * gap)) / 2);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) actx.drawImage(tile, sx + c * (tw + gap), 70 + r * (th + 28), tw, th);
      a4.toBlob(b => setOutput(b, `a4_${rows * cols}_photos_300dpi.jpg`), 'image/jpeg', 0.98);
    }

    // ================= 5. FULL-RES FILTERS & DP MAKER =================
    let fxImg = null, fxIsPng = false;
    function loadFx(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { fxImg = im; document.getElementById('fx-ui').classList.remove('hidden'); applyFx('orig'); };
      im.src = URL.createObjectURL(f);
    }
    function applyFx(type) {
      if (!fxImg) return;
      const c = document.getElementById('fx-canvas'), ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      fxIsPng = (type === 'circle');
      // Preserve up to 2600px full HD resolution
      const s = Math.min(1, 2600 / Math.max(fxImg.width, fxImg.height));
      const w = Math.round(fxImg.width * s), h = Math.round(fxImg.height * s);

      if (type === 'nocrop' || type === 'circle') {
        const side = Math.max(w, h); c.width = side; c.height = side; ctx.clearRect(0, 0, side, side);
        if (type === 'nocrop') {
          ctx.filter = 'blur(26px) brightness(0.85)'; ctx.drawImage(fxImg, -30, -30, side + 60, side + 60);
          ctx.filter = 'none'; ctx.drawImage(fxImg, (side - w) / 2, (side - h) / 2, w, h);
        } else {
          ctx.save(); ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - 14, 0, Math.PI * 2); ctx.clip();
          const minS = Math.min(fxImg.width, fxImg.height);
          ctx.drawImage(fxImg, (fxImg.width - minS)/2, (fxImg.height - minS)/2, minS, minS, 0, 0, side, side);
          ctx.restore();
          ctx.lineWidth = Math.max(12, side / 36); ctx.strokeStyle = '#3b82f6';
          ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - ctx.lineWidth/2, 0, Math.PI * 2); ctx.stroke();
        }
        return;
      }
      if (type === 'wborder' || type === 'bborder') {
        const bw = Math.max(24, Math.round(Math.min(w, h) / 18));
        c.width = w + bw * 2; c.height = h + bw * 2;
        ctx.fillStyle = type === 'wborder' ? '#ffffff' : '#000000'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(fxImg, bw, bw, w, h); return;
      }
      c.width = w; c.height = h;
      ctx.filter = type === 'enhance' ? 'contrast(1.18) saturate(1.16) brightness(1.04)'
                 : type === 'bw' ? 'grayscale(1) contrast(1.16)'
                 : type === 'vintage' ? 'sepia(0.65) contrast(1.12)'
                 : type === 'blur' ? 'blur(5px)' : 'none';
      ctx.drawImage(fxImg, 0, 0, w, h); ctx.filter = 'none';
      if (type === 'sharp' || type === 'enhance') sharpenCanvas(c, type === 'sharp' ? 0.42 : 0.25);
    }
    function saveFx() {
      const c = document.getElementById('fx-canvas');
      c.toBlob(b => setOutput(b, fxIsPng ? 'solvrik_circle_dp_hd.png' : 'solvrik_edited_hd.jpg'), fxIsPng ? 'image/png' : 'image/jpeg', 0.97);
    }

    // ================= 6. HD ID JOIN, COLLAGE, TRANSPARENT SIGN & RESIZE =================
    let multiImgs = [];
    function loadMultiSoc(e) {
      const files = Array.from(e.target.files || []).slice(0, 4);
      if (!files.length) return;
      multiImgs = []; let loaded = 0;
      files.forEach(f => {
        const im = new Image();
        im.onload = () => {
          multiImgs.push(im); loaded++;
          if (loaded === files.length) {
            document.getElementById('soc-ui').classList.remove('hidden');
            document.getElementById('soc-count').textContent = `✅ ${multiImgs.length} HD photo(s) selected.`;
            document.getElementById('rs-w').value = multiImgs[0].width;
            document.getElementById('rs-h').value = multiImgs[0].height;
          }
        };
        im.src = URL.createObjectURL(f);
      });
    }
    function runIdJoin() {
      if (multiImgs.length < 2) { alert('Front aur Back dono (2 photos) ek saath chunein!'); return; }
      const a = multiImgs[0], b = multiImgs[1], tw = Math.max(1400, Math.min(2200, a.width, b.width)), pad = 50;
      const h1 = Math.round(a.height * tw / a.width), h2 = Math.round(b.height * tw / b.width);
      const c = document.createElement('canvas'); c.width = tw + pad * 2; c.height = h1 + h2 + pad * 3;
      const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(a, pad, pad, tw, h1); ctx.drawImage(b, pad, h1 + pad * 2, tw, h2);
      c.toBlob(bl => setOutput(bl, 'id_card_joined_hd.jpg'), 'image/jpeg', 0.97);
    }
    function runCollage() {
      if (multiImgs.length < 2) { alert('Kam se kam 2 photos chunein!'); return; }
      const gap = 24, sz = 1100, c = document.createElement('canvas');
      if (multiImgs.length === 2) {
        c.width = sz * 2 + gap * 3; c.height = sz + gap * 2;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        [multiImgs[0], multiImgs[1]].forEach((im, i) => {
          const m = Math.min(im.width, im.height);
          ctx.drawImage(im, (im.width - m)/2, (im.height - m)/2, m, m, gap + i * (sz + gap), gap, sz, sz);
        });
      } else {
        c.width = sz * 2 + gap * 3; c.height = sz * 2 + gap * 3;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        multiImgs.slice(0, 4).forEach((im, i) => {
          const m = Math.min(im.width, im.height), r = Math.floor(i / 2), col = i % 2;
          ctx.drawImage(im, (im.width - m)/2, (im.height - m)/2, m, m, gap + col * (sz + gap), gap + r * (sz + gap), sz, sz);
        });
      }
      c.toBlob(bl => setOutput(bl, 'solvrik_collage_hd.jpg'), 'image/jpeg', 0.96);
    }
    function runTransSign() {
      if (!multiImgs.length) return;
      const im = multiImgs[0], c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0);
      const id = ctx.getImageData(0, 0, c.width, c.height), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (g > 165) { d[i + 3] = 0; }
        else { d[i] = Math.round(d[i] * 0.62); d[i + 1] = Math.round(d[i + 1] * 0.62); d[i + 2] = Math.round(d[i + 2] * 0.62); d[i + 3] = 255; }
      }
      ctx.putImageData(id, 0, 0);
      c.toBlob(bl => setOutput(bl, 'signature_transparent_hd.png'), 'image/png');
    }
    function runSticker() {
      if (!multiImgs.length) return;
      const im = multiImgs[0], s = 512 / Math.max(im.width, im.height);
      const c = progressiveResize(im, Math.round(im.width * s), Math.round(im.height * s));
      sharpenCanvas(c, 0.22);
      c.toBlob(bl => setOutput(bl, 'telegram_sticker.webp'), 'image/webp', 0.96);
    }
    function runCustomResize() {
      if (!multiImgs.length) return;
      const im = multiImgs[0];
      const nw = Math.max(16, Math.min(4500, parseInt(document.getElementById('rs-w').value, 10) || im.width));
      const nh = Math.max(16, Math.min(4500, parseInt(document.getElementById('rs-h').value, 10) || im.height));
      const c = progressiveResize(im, nw, nh);
      sharpenCanvas(c, 0.22);
      c.toBlob(bl => setOutput(bl, `resized_${nw}x${nh}_hd.jpg`), 'image/jpeg', 0.97);
    }
    function runWatermark() {
      if (!multiImgs.length) return;
      const im = multiImgs[0], txt = document.getElementById('wm-text').value.trim() || '@SolvrikHQ';
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const ctx = c.getContext('2d'); ctx.drawImage(im, 0, 0);
      const fs = Math.max(28, Math.round(c.width / 14));
      ctx.font = `bold ${fs}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
      ctx.save(); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(-0.45);
      for (let y = -c.height; y < c.height; y += fs * 3.5) for (let x = -c.width; x < c.width; x += fs * 7) { ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y); }
      ctx.restore();
      c.toBlob(bl => setOutput(bl, 'watermarked_hd.jpg'), 'image/jpeg', 0.96);
    }
  </script>
</body>
