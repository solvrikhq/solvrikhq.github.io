<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solvrik Pro Studio</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    :root { --bg: #0b1120; --card: #162032; --accent: #3b82f6; --green: #10b981; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 44px; }

    /* Instant Top Status Bar */
    .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .hdr h2 { margin: 0; font-size: 17px; }
    .badge { background: #1d4ed8; font-size: 11px; padding: 4px 9px; border-radius: 20px; font-weight: 600; }

    .pbar-wrap { width: 100%; height: 5px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
    .pbar-fill { height: 100%; width: 35%; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width 0.2s; }

    /* Clean 2-Column Stacked Tabs */
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; margin-bottom: 12px; }
    .tab { padding: 10px 8px; border: 1px solid #263349; border-radius: 10px; background: var(--card); color: var(--muted); font-weight: 600; font-size: 12.5px; cursor: pointer; text-align: center; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid #223047; }
    .upload-box { border: 2px dashed #3b82f688; border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer; display: block; background: #0f172a; }
    .upload-box span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
    input[type="file"] { display: none; }

    .canvas-box { position: relative; margin-top: 10px; background: #020617; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; touch-action: none; }
    canvas, img { max-width: 100%; max-height: 360px; display: block; }

    .row { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 110px; padding: 12px 10px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px; cursor: pointer; text-align: center; }
    .btn.sec { background: #263349; }
    .btn.green { background: var(--green); }
    .btn:active { transform: scale(0.98); }

    input[type="number"], input[type="text"], select { width: 100%; padding: 10px; border-radius: 9px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13.5px; margin-top: 8px; }
    input[type="range"] { width: 100%; margin-top: 6px; accent-color: #3b82f6; }
    .slider-lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    .pill { padding: 7px 11px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 12px; cursor: pointer; }
    .pill.on { background: var(--accent); border-color: var(--accent); }
    .info { font-size: 13px; color: #38bdf8; margin-top: 8px; font-weight: 600; word-break: break-word; }
    .hidden { display: none !important; }

    /* Output Preview + Direct Download Box */
    #out-box { margin-top: 14px; background: #0f172a; border: 2px solid #10b981; border-radius: 12px; padding: 12px; text-align: center; }
    #out-box img { margin: 0 auto; border-radius: 8px; max-height: 280px; }
  </style>
</head>
<body>
  <div class="hdr">
    <h2>⚡ Solvrik Pro Studio</h2>
    <span id="status-badge" class="badge">Loading 40%...</span>
  </div>
  <div class="pbar-wrap"><div id="pbar" class="pbar-fill"></div></div>

  <!-- LINE-BY-LINE STACKED TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('crop', this)">✂️ 4-Corner Crop & Rotate</button>
    <button class="tab" onclick="switchTab('kb', this)">📦 Exact KB / MB Size</button>
    <button class="tab" onclick="switchTab('pass', this)">🪪 Passport & Exam</button>
    <button class="tab" onclick="switchTab('fx', this)">🎨 Filters & DP Maker</button>
    <button class="tab" onclick="switchTab('doc', this)">📄 Ink Saver • Sign • Resize</button>
    <button class="tab" onclick="switchTab('soc', this)">📱 ID Join • Collage • Grid</button>
  </div>

  <!-- INLINE OUTPUT PREVIEW & DIRECT SAVE -->
  <div id="out-box" class="hidden">
    <div id="out-title" style="font-size:13px;font-weight:700;color:#10b981;margin-bottom:8px">✅ File Ready!</div>
    <img id="out-img" />
    <div style="font-size:11.5px;color:#94a3b8;margin-top:6px">👇 Niche <b>Direct Download</b> dabayein (ya photo par Hold karke Save karein):</div>
    <div class="row">
      <button class="btn green" onclick="triggerRealDownload()">⬇️ Direct Download</button>
      <button class="btn" onclick="shareOrSaveFile()">📤 Share / Save to Phone</button>
      <button class="btn sec" style="min-width:70px;flex:0" onclick="document.getElementById('out-box').classList.add('hidden')">✖️</button>
    </div>
  </div>

  <!-- 1. 4-CORNER STRETCHABLE PERSPECTIVE CROP + FIXED RATIOS + 1° ROTATE -->
  <div id="tab-crop" class="card">
    <label class="upload-box">
      📸 <b>Card / Document / Photo chunein</b>
      <span>Fixed Ratios + 4-Corner Stretch + 1° Fine Rotate</span>
      <input type="file" accept="image/*" onchange="loadCrop(event)" />
    </label>
    <div id="crop-ui" class="hidden">
      <div class="canvas-box"><canvas id="quad-canvas"></canvas></div>

      <!-- Fixed Ratio Presets + Free Stretch -->
      <div class="row">
        <button class="pill on" onclick="setQuadRatio(null, this)">Free Stretch</button>
        <button class="pill" onclick="setQuadRatio(85.6/54, this)">ID Card</button>
        <button class="pill" onclick="setQuadRatio(1, this)">1:1</button>
        <button class="pill" onclick="setQuadRatio(4/5, this)">4:5</button>
        <button class="pill" onclick="setQuadRatio(16/9, this)">16:9</button>
        <button class="pill" onclick="setQuadRatio(3/4, this)">3:4</button>
        <button class="pill" onclick="setQuadRatio(210/297, this)">A4 Doc</button>
      </div>

      <div class="slider-lbl">
        <span>🔄 Fine Rotate (1° step)</span>
        <b id="rot-val" style="color:#38bdf8">0°</b>
      </div>
      <input type="range" id="rot-slider" min="-180" max="180" step="1" value="0" oninput="onRotateSlider(this.value)" />

      <div class="row">
        <button class="btn sec" onclick="stepRotate(-90)">↺ -90°</button>
        <button class="btn sec" onclick="stepRotate(90)">↻ +90°</button>
        <button class="btn sec" onclick="setQuadRatio(null)">Reset</button>
      </div>
      <div class="row">
        <button class="btn" onclick="exportQuadCrop(false)">✂️ Crop Color</button>
        <button class="btn green" onclick="exportQuadCrop(true)">📄 B&W Doc Scan</button>
      </div>
    </div>
  </div>

  <!-- 2. EXACT KB / MB COMPRESSOR -->
  <div id="tab-kb" class="card hidden">
    <label class="upload-box">
      🖼️ <b>Photo chunein (10 KB se 5 MB tak)</b>
      <span>Live Quality & Resolution Preview</span>
      <input type="file" accept="image/*" onchange="loadKb(event)" />
    </label>
    <div id="kb-ui" class="hidden">
      <div class="row">
        <button class="pill" onclick="setKb(10)">10 KB</button>
        <button class="pill" onclick="setKb(20)">20 KB</button>
        <button class="pill" onclick="setKb(50)">50 KB</button>
        <button class="pill" onclick="setKb(100)">100 KB</button>
        <button class="pill" onclick="setKb(200)">200 KB</button>
        <button class="pill" onclick="setKb(1024)">1 MB</button>
        <button class="pill" onclick="setKb(2048)">2 MB</button>
        <button class="pill" onclick="setKb(5120)">5 MB</button>
      </div>
      <input type="number" id="kb-val" value="20" min="3" max="15000" placeholder="Custom KB (e.g. 20 ya 5120)" />
      <button class="btn" style="width:100%;margin-top:8px" onclick="runKb()">⚡ Compress to Exact Size</button>
      <div id="kb-stat" class="info"></div>
    </div>
  </div>

  <!-- 3. PASSPORT, A4 SHEET & EXAM PRESETS -->
  <div id="tab-pass" class="card hidden">
    <label class="upload-box">
      🪪 <b>Selfie / Portrait / Signature chunein</b>
      <span>35×45mm Passport, A4 Print Sheet & SSC/UPSC/JEE Presets</span>
      <input type="file" accept="image/*" onchange="loadPass(event)" />
    </label>
    <div id="pass-ui" class="hidden">
      <div class="canvas-box"><canvas id="pass-canvas"></canvas></div>
      <select id="pass-mode" onchange="renderPassPreview()">
        <option value="single">Single Passport (35×45mm, 300 DPI)</option>
        <option value="a4_6">A4 Print Sheet — 6 Photos (1 Row)</option>
        <option value="a4_12">A4 Print Sheet — 12 Photos (2 Rows)</option>
        <option value="a4_30">A4 Print Sheet — 30 Photos (5 Rows)</option>
        <option value="ssc">SSC / Bank / Railway Preset (20–50 KB)</option>
        <option value="upsc">UPSC Preset (Square 500×500, ≤180 KB)</option>
        <option value="jee">JEE / NEET Preset (35×45mm, ≤95 KB)</option>
        <option value="sign">Exam Signature Preset (280×120, ≤18 KB)</option>
      </select>
      <input type="text" id="pass-label" oninput="renderPassPreview()" placeholder="Optional Name | Date (e.g. Amit Kumar | 28/11/2026)" />
      <button class="btn green" style="width:100%;margin-top:10px" onclick="exportPassport()">🪪 Generate Passport / Preset</button>
      <div id="pass-stat" class="info"></div>
    </div>
  </div>

  <!-- 4. FILTERS, BORDERS & DP MAKER -->
  <div id="tab-fx" class="card hidden">
    <label class="upload-box">
      🎨 <b>Photo chunein (Enhance, Filters & DP)</b>
      <span>Auto HD, Circular DP, No-Crop Blur DP & Borders</span>
      <input type="file" accept="image/*" onchange="loadFx(event)" />
    </label>
    <div id="fx-ui" class="hidden">
      <div class="canvas-box"><canvas id="fx-canvas"></canvas></div>
      <div class="row">
        <button class="pill" onclick="applyFx('orig')">Original</button>
        <button class="pill" onclick="applyFx('enhance')">✨ Auto HD</button>
        <button class="pill" onclick="applyFx('bw')">⚫ B&W</button>
        <button class="pill" onclick="applyFx('vintage')">🎞️ Vintage</button>
        <button class="pill" onclick="applyFx('blur')">💧 Blur</button>
      </div>
      <div class="row">
        <button class="pill" onclick="applyFx('wborder')">⬜ White Border</button>
        <button class="pill" onclick="applyFx('bborder')">⬛ Black Border</button>
        <button class="pill" onclick="applyFx('nocrop')">🖼️ No-Crop DP</button>
        <button class="pill" onclick="applyFx('circle')">🔵 Circular DP</button>
      </div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="saveFx()">✅ Ready to Download</button>
    </div>
  </div>

  <!-- 5. INK SAVER, TRANSPARENT SIGNATURE, RESIZE & WATERMARK -->
  <div id="tab-doc" class="card hidden">
    <label class="upload-box">
      📄 <b>Document / Signature / Photo chunein</b>
      <span>Ink Saver, Transparent Sign PNG, Custom Resize & Watermark</span>
      <input type="file" accept="image/*" onchange="loadDocTool(event)" />
    </label>
    <div id="doc-ui" class="hidden">
      <div class="canvas-box"><img id="doc-img" /></div>
      <div class="row">
        <button class="btn" onclick="runInkSaver()">🖨️ Ink Saver (Print)</button>
        <button class="btn green" onclick="runTransSign()">✍️ Transparent Sign PNG</button>
      </div>
      <div class="row">
        <input type="number" id="rs-w" placeholder="Width px (e.g. 1080)" style="flex:1" />
        <input type="number" id="rs-h" placeholder="Height px (e.g. 1080)" style="flex:1" />
        <button class="btn sec" onclick="runCustomResize()">📐 Resize</button>
      </div>
      <div class="row">
        <input type="text" id="wm-text" placeholder="Watermark text (e.g. @SolvrikHQ)" style="flex:2" />
        <button class="btn sec" onclick="runWatermark()">💧 Stamp</button>
      </div>
    </div>
  </div>

  <!-- 6. ID CARD JOINER, COLLAGE, INSTA GRID & STICKER -->
  <div id="tab-soc" class="card hidden">
    <label class="upload-box">
      🪪 <b>1 ya 2–4 Photos chunein (Multi-Select)</b>
      <span>Front+Back ID Join, 2/4 Photo Collage, Insta Grid & TG Sticker</span>
      <input type="file" accept="image/*" multiple onchange="loadMultiSoc(event)" />
    </label>
    <div id="soc-ui" class="hidden">
      <div id="soc-count" class="info"></div>
      <div class="row">
        <button class="btn" onclick="runIdJoin()">🪪 Join ID Card (Front+Back)</button>
        <button class="btn green" onclick="runCollage()">🖼️ Make Collage (2–4)</button>
      </div>
      <div class="row">
        <button class="btn sec" onclick="runSticker()">🎭 TG Sticker (512px)</button>
        <button class="btn sec" onclick="runInstaGrid()">🧩 Insta 3×3 Grid</button>
      </div>
      <div id="grid-out" class="row"></div>
    </div>
  </div>

  <script>
    let lastBlob = null, lastFilename = 'solvrik_output.jpg';

    // Fast non-blocking startup progress
    window.addEventListener('DOMContentLoaded', () => {
      const bar = document.getElementById('pbar'), badge = document.getElementById('status-badge');
      bar.style.width = '100%';
      badge.textContent = 'Ready • 100%';
      badge.style.background = '#059669';
      if (window.Telegram?.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
      }
    });

    function switchTab(id, btn) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['crop', 'kb', 'pass', 'fx', 'doc', 'soc'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== id));
    }

    // Show output preview + trigger native download
    function setOutput(blob, filename, titleText) {
      if (!blob) return;
      lastBlob = blob;
      lastFilename = filename || 'solvrik_output.jpg';
      const box = document.getElementById('out-box');
      document.getElementById('out-title').textContent = titleText || `✅ Ready: ${lastFilename} (${(blob.size / 1024).toFixed(1)} KB)`;
      document.getElementById('out-img').src = URL.createObjectURL(blob);
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      triggerRealDownload();
    }

    // Multi-fallback real download for Telegram Web, Desktop & Mobile
    function triggerRealDownload() {
      if (!lastBlob) return;
      const reader = new FileReader();
      reader.onloadend = function () {
        const dataUrl = reader.result;
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = lastFilename;
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 200);
      };
      reader.readAsDataURL(lastBlob);
    }

    async function shareOrSaveFile() {
      if (!lastBlob) return;
      try {
        const file = new File([lastBlob], lastFilename, { type: lastBlob.type || 'image/jpeg' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: lastFilename });
          return;
        }
      } catch (e) {}
      triggerRealDownload();
    }

    // ================= 1. 4-CORNER STRETCHABLE CROP + FIXED RATIOS + 1° ROTATE =================
    let rawCropImg = null, rotCanvas = document.createElement('canvas'), rotAngle = 0;
    let quadPts = [], activePt = -1;

    function loadCrop(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => {
        rawCropImg = im; rotAngle = 0;
        document.getElementById('rot-slider').value = 0;
        document.getElementById('rot-val').textContent = '0°';
        document.getElementById('crop-ui').classList.remove('hidden');
        rebuildRotatedBase(true);
      };
      im.src = URL.createObjectURL(f);
    }

    function onRotateSlider(val) {
      rotAngle = parseInt(val, 10) || 0;
      document.getElementById('rot-val').textContent = rotAngle + '°';
      rebuildRotatedBase(false);
    }

    function stepRotate(delta) {
      rotAngle = ((rotAngle + delta + 180) % 360) - 180;
      document.getElementById('rot-slider').value = rotAngle;
      document.getElementById('rot-val').textContent = rotAngle + '°';
      rebuildRotatedBase(true);
    }

    function setQuadRatio(ratio, btnEl) {
      if (btnEl) {
        document.querySelectorAll('#tab-crop .pill').forEach(p => p.classList.remove('on'));
        btnEl.classList.add('on');
      }
      const w = rotCanvas.width, h = rotCanvas.height;
      if (!ratio) {
        quadPts = [
          { x: w * 0.12, y: h * 0.15 },
          { x: w * 0.88, y: h * 0.15 },
          { x: w * 0.88, y: h * 0.85 },
          { x: w * 0.12, y: h * 0.85 }
        ];
      } else {
        let rw = w * 0.80, rh = rw / ratio;
        if (rh > h * 0.80) { rh = h * 0.80; rw = rh * ratio; }
        const x1 = (w - rw) / 2, y1 = (h - rh) / 2;
        quadPts = [
          { x: x1, y: y1 },
          { x: x1 + rw, y: y1 },
          { x: x1 + rw, y: y1 + rh },
          { x: x1, y: y1 + rh }
        ];
      }
      drawQuadOverlay();
    }

    function rebuildRotatedBase(resetCorners) {
      if (!rawCropImg) return;
      const maxDim = 1400;
      const s = Math.min(1, maxDim / Math.max(rawCropImg.width, rawCropImg.height));
      const sw = Math.round(rawCropImg.width * s), sh = Math.round(rawCropImg.height * s);
      const rad = rotAngle * Math.PI / 180;
      const cos = Math.abs(Math.cos(rad)), sin = Math.abs(Math.sin(rad));
      const nw = Math.round(sw * cos + sh * sin), nh = Math.round(sw * sin + sh * cos);

      rotCanvas.width = nw; rotCanvas.height = nh;
      const ctx = rotCanvas.getContext('2d');
      ctx.fillStyle = '#020617'; ctx.fillRect(0, 0, nw, nh);
      ctx.save(); ctx.translate(nw / 2, nh / 2); ctx.rotate(rad);
      ctx.drawImage(rawCropImg, -sw / 2, -sh / 2, sw, sh);
      ctx.restore();

      if (resetCorners || quadPts.length !== 4) setQuadRatio(null);
      else {
        quadPts.forEach(p => { p.x = Math.min(nw - 4, Math.max(4, p.x)); p.y = Math.min(nh - 4, Math.max(4, p.y)); });
        drawQuadOverlay();
      }
    }

    function drawQuadOverlay() {
      const qc = document.getElementById('quad-canvas');
      qc.width = rotCanvas.width; qc.height = rotCanvas.height;
      const ctx = qc.getContext('2d');
      ctx.drawImage(rotCanvas, 0, 0);

      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
      ctx.beginPath();
      ctx.rect(0, 0, qc.width, qc.height);
      ctx.moveTo(quadPts[0].x, quadPts[0].y);
      for (let i = 3; i >= 0; i--) ctx.lineTo(quadPts[i].x, quadPts[i].y);
      ctx.closePath();
      ctx.fill('evenodd');
      ctx.restore();

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = Math.max(3, qc.width / 220);
      ctx.beginPath();
      ctx.moveTo(quadPts[0].x, quadPts[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(quadPts[i].x, quadPts[i].y);
      ctx.closePath();
      ctx.stroke();

      const r = Math.max(16, qc.width / 34);
      quadPts.forEach((pt, idx) => {
        ctx.fillStyle = idx === activePt ? '#10b981' : '#3b82f6';
        ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.stroke();
      });
    }

    (function bindQuadTouch() {
      const qc = document.getElementById('quad-canvas');
      function getPos(ev) {
        const rect = qc.getBoundingClientRect(), t = ev.touches ? ev.touches[0] : ev;
        return { x: (t.clientX - rect.left) * (qc.width / rect.width), y: (t.clientY - rect.top) * (qc.height / rect.height) };
      }
      function down(ev) {
        if (quadPts.length !== 4) return;
        const p = getPos(ev), hitR = Math.max(38, qc.width / 13);
        let best = -1, bestD = hitR;
        quadPts.forEach((pt, i) => { const d = Math.hypot(pt.x - p.x, pt.y - p.y); if (d < bestD) { bestD = d; best = i; } });
        if (best !== -1) { activePt = best; ev.preventDefault(); drawQuadOverlay(); }
      }
      function move(ev) {
        if (activePt === -1) return;
        ev.preventDefault();
        const p = getPos(ev);
        quadPts[activePt].x = Math.max(0, Math.min(qc.width, p.x));
        quadPts[activePt].y = Math.max(0, Math.min(qc.height, p.y));
        drawQuadOverlay();
      }
      function up() { if (activePt !== -1) { activePt = -1; drawQuadOverlay(); } }
      qc.addEventListener('mousedown', down); window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
      qc.addEventListener('touchstart', down, { passive: false }); window.addEventListener('touchmove', move, { passive: false }); window.addEventListener('touchend', up);
    })();

    function exportQuadCrop(bwMode) {
      if (quadPts.length !== 4) return;
      const sortedY = [...quadPts].sort((a, b) => a.y - b.y);
      const top = sortedY.slice(0, 2).sort((a, b) => a.x - b.x);
      const bot = sortedY.slice(2, 4).sort((a, b) => a.x - b.x);
      const tl = top[0], tr = top[1], br = bot[1], bl = bot[0];

      const outW = Math.max(120, Math.round(Math.max(Math.hypot(tr.x - tl.x, tr.y - tl.y), Math.hypot(br.x - bl.x, br.y - bl.y))));
      const outH = Math.max(120, Math.round(Math.max(Math.hypot(bl.x - tl.x, bl.y - tl.y), Math.hypot(br.x - tr.x, br.y - tr.y))));

      const sPx = rotCanvas.getContext('2d').getImageData(0, 0, rotCanvas.width, rotCanvas.height).data;
      const sw = rotCanvas.width, sh = rotCanvas.height;
      const outCanvas = document.createElement('canvas'); outCanvas.width = outW; outCanvas.height = outH;
      const outCtx = outCanvas.getContext('2d'), outImg = outCtx.createImageData(outW, outH), dPx = outImg.data;

      for (let y = 0; y < outH; y++) {
        const v = y / (outH - 1);
        const lx = tl.x + (bl.x - tl.x) * v, ly = tl.y + (bl.y - tl.y) * v;
        const rx = tr.x + (br.x - tr.x) * v, ry = tr.y + (br.y - tr.y) * v;
        for (let x = 0; x < outW; x++) {
          const u = x / (outW - 1);
          const sx = Math.min(sw - 1, Math.max(0, Math.round(lx + (rx - lx) * u)));
          const sy = Math.min(sh - 1, Math.max(0, Math.round(ly + (ry - ly) * u)));
          const si = (sy * sw + sx) * 4, di = (y * outW + x) * 4;
          if (bwMode) {
            const g = 0.299 * sPx[si] + 0.587 * sPx[si + 1] + 0.114 * sPx[si + 2];
            const val = g > 142 ? 255 : Math.max(0, (g - 35) * 1.42);
            dPx[di] = dPx[di + 1] = dPx[di + 2] = val;
          } else {
            dPx[di] = sPx[si]; dPx[di + 1] = sPx[si + 1]; dPx[di + 2] = sPx[si + 2];
          }
          dPx[di + 3] = 255;
        }
      }
      outCtx.putImageData(outImg, 0, 0);
      outCanvas.toBlob(b => setOutput(b, bwMode ? 'solvrik_doc_scan.jpg' : 'solvrik_cropped.jpg'), 'image/jpeg', 0.94);
    }

    // ================= 2. EXACT KB / MB COMPRESSOR =================
    let kbImg = null;
    function setKb(v) { document.getElementById('kb-val').value = v; runKb(); }
    function loadKb(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { kbImg = im; document.getElementById('kb-ui').classList.remove('hidden'); runKb(); };
      im.src = URL.createObjectURL(f);
    }
    async function compressCanvasToBytes(srcCanvas, targetBytes) {
      let w = srcCanvas.width, h = srcCanvas.height;
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      let best = null, bq = 0.85;
      for (let s = 0; s < 9; s++) {
        c.width = w; c.height = h; ctx.drawImage(srcCanvas, 0, 0, w, h);
        let lo = 0.22, hi = 0.95;
        for (let i = 0; i < 6; i++) {
          const mid = (lo + hi) / 2;
          const b = await new Promise(r => c.toBlob(r, 'image/jpeg', mid));
          if (b.size <= targetBytes) { best = b; bq = mid; lo = mid; } else { hi = mid; }
        }
        if (best) return { blob: best, w, h, q: bq };
        w = Math.max(220, Math.round(w * 0.78)); h = Math.max(220, Math.round(h * 0.78));
      }
      const fb = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.20));
      return { blob: fb, w, h, q: 0.20 };
    }
    async function runKb() {
      if (!kbImg) return;
      const targetKb = Math.max(3, parseFloat(document.getElementById('kb-val').value || 20));
      let w = kbImg.width, h = kbImg.height;
      if (targetKb <= 300 && Math.max(w, h) > 1200) {
        const s = 1200 / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s);
      }
      const base = document.createElement('canvas'); base.width = w; base.height = h;
      base.getContext('2d').drawImage(kbImg, 0, 0, w, h);
      const res = await compressCanvasToBytes(base, targetKb * 1024);
      document.getElementById('kb-stat').textContent = `✅ Ready: ${(res.blob.size / 1024).toFixed(1)} KB | ${res.w}×${res.h} px | Q${Math.round(res.q * 100)}%`;
      setOutput(res.blob, `solvrik_${Math.round(targetKb)}kb.jpg`);
    }

    // ================= 3. PASSPORT, A4 & EXAM PRESETS =================
    let passImg = null;
    function loadPass(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { passImg = im; document.getElementById('pass-ui').classList.remove('hidden'); renderPassPreview(); };
      im.src = URL.createObjectURL(f);
    }
    function buildPassportTile() {
      const mode = document.getElementById('pass-mode').value;
      const label = document.getElementById('pass-label').value.trim();
      const pw = mode === 'upsc' ? 500 : (mode === 'sign' ? 280 : 413);
      const ph = mode === 'upsc' ? 500 : (mode === 'sign' ? 120 : 531);

      const tile = document.createElement('canvas');
      const hasLabel = label && mode !== 'sign' && mode !== 'upsc';
      tile.width = pw + 6; tile.height = (hasLabel ? ph + 80 : ph) + 6;
      const ctx = tile.getContext('2d');
      ctx.fillStyle = '#222'; ctx.fillRect(0, 0, tile.width, tile.height);
      ctx.fillStyle = '#fff'; ctx.fillRect(3, 3, tile.width - 6, tile.height - 6);

      const targetRatio = pw / ph, imgRatio = passImg.width / passImg.height;
      let sx = 0, sy = 0, sw = passImg.width, sh = passImg.height;
      if (imgRatio > targetRatio) { sw = Math.round(sh * targetRatio); sx = Math.round((passImg.width - sw) / 2); }
      else { sh = Math.round(sw / targetRatio); sy = Math.round((passImg.height - sh) * 0.25); }
      ctx.drawImage(passImg, sx, sy, sw, sh, 3, 3, pw, ph);

      if (hasLabel) {
        ctx.fillStyle = '#000'; ctx.fillRect(3, ph + 3, pw, 2);
        const parts = label.split('|').map(s => s.trim());
        ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(parts[0].slice(0, 24), tile.width / 2, ph + 34);
        if (parts[1]) { ctx.font = '18px sans-serif'; ctx.fillText(parts[1].slice(0, 24), tile.width / 2, ph + 64); }
      }
      return tile;
    }
    function renderPassPreview() {
      if (!passImg) return;
      const tile = buildPassportTile(), pc = document.getElementById('pass-canvas');
      pc.width = tile.width; pc.height = tile.height; pc.getContext('2d').drawImage(tile, 0, 0);
    }
    async function exportPassport() {
      if (!passImg) return;
      const mode = document.getElementById('pass-mode').value, tile = buildPassportTile();
      if (mode === 'sign' || mode === 'upsc' || mode === 'ssc' || mode === 'jee') {
        const maxKb = mode === 'sign' ? 18 : (mode === 'upsc' ? 180 : (mode === 'jee' ? 95 : 45));
        const res = await compressCanvasToBytes(tile, maxKb * 1024);
        setOutput(res.blob, `${mode}_ready.jpg`); return;
      }
      if (mode === 'single') { tile.toBlob(b => setOutput(b, 'passport_single.jpg'), 'image/jpeg', 0.95); return; }
      const rows = mode === 'a4_6' ? 1 : (mode === 'a4_12' ? 2 : 5), cols = 6;
      const a4 = document.createElement('canvas'); a4.width = 2480; a4.height = 3508;
      const actx = a4.getContext('2d'); actx.fillStyle = '#fff'; actx.fillRect(0, 0, 2480, 3508);
      const tw = 375, th = Math.round(tw * tile.height / tile.width), gap = 24;
      const sx = Math.round((2480 - (cols * tw + (cols - 1) * gap)) / 2);
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) actx.drawImage(tile, sx + c * (tw + gap), 70 + r * (th + 28), tw, th);
      a4.toBlob(b => setOutput(b, `a4_${rows * cols}_photos.jpg`), 'image/jpeg', 0.95);
    }

    // ================= 4. FILTERS & DP =================
    let fxImg = null, fxIsPng = false;
    function loadFx(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { fxImg = im; document.getElementById('fx-ui').classList.remove('hidden'); applyFx('orig'); };
      im.src = URL.createObjectURL(f);
    }
    function applyFx(type) {
      if (!fxImg) return;
      const c = document.getElementById('fx-canvas'), ctx = c.getContext('2d');
      fxIsPng = (type === 'circle');
      let w = fxImg.width, h = fxImg.height;
      if (Math.max(w, h) > 1200) { const s = 1200 / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }

      if (type === 'nocrop' || type === 'circle') {
        const side = Math.max(w, h); c.width = side; c.height = side; ctx.clearRect(0, 0, side, side);
        if (type === 'nocrop') {
          ctx.filter = 'blur(22px) brightness(0.85)'; ctx.drawImage(fxImg, -30, -30, side + 60, side + 60);
          ctx.filter = 'none'; ctx.drawImage(fxImg, (side - w) / 2, (side - h) / 2, w, h);
        } else {
          ctx.save(); ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - 14, 0, Math.PI * 2); ctx.clip();
          const minS = Math.min(fxImg.width, fxImg.height);
          ctx.drawImage(fxImg, (fxImg.width - minS)/2, (fxImg.height - minS)/2, minS, minS, 0, 0, side, side);
          ctx.restore();
          ctx.lineWidth = Math.max(12, side / 36); ctx.strokeStyle = '#3b82f6';
          ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - ctx.lineWidth/2, 0, Math.PI * 2); ctx.stroke();
        }
        return;
      }
      if (type === 'wborder' || type === 'bborder') {
        const bw = Math.max(24, Math.round(Math.min(w, h) / 18));
        c.width = w + bw * 2; c.height = h + bw * 2;
        ctx.fillStyle = type === 'wborder' ? '#ffffff' : '#000000'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(fxImg, bw, bw, w, h); return;
      }
      c.width = w; c.height = h;
      ctx.filter = type === 'enhance' ? 'contrast(1.18) saturate(1.15) brightness(1.04)'
                 : type === 'bw' ? 'grayscale(1) contrast(1.15)'
                 : type === 'vintage' ? 'sepia(0.65) contrast(1.1)'
                 : type === 'blur' ? 'blur(5px)' : 'none';
      ctx.drawImage(fxImg, 0, 0, w, h); ctx.filter = 'none';
    }
    function saveFx() {
      const c = document.getElementById('fx-canvas');
      c.toBlob(b => setOutput(b, fxIsPng ? 'solvrik_circle_dp.png' : 'solvrik_edited.jpg'), fxIsPng ? 'image/png' : 'image/jpeg', 0.94);
    }

    // ================= 5. INK SAVER, TRANSPARENT SIGN, RESIZE & WATERMARK =================
    let docImg = null;
    function loadDocTool(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => {
        docImg = im;
        document.getElementById('doc-ui').classList.remove('hidden');
        document.getElementById('doc-img').src = im.src;
        document.getElementById('rs-w').value = im.width;
        document.getElementById('rs-h').value = im.height;
      };
      im.src = URL.createObjectURL(f);
    }
    function runInkSaver() {
      if (!docImg) return;
      const c = document.createElement('canvas'); c.width = docImg.width; c.height = docImg.height;
      const ctx = c.getContext('2d'); ctx.drawImage(docImg, 0, 0);
      const id = ctx.getImageData(0, 0, c.width, c.height), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (g > 155) { d[i] = d[i + 1] = d[i + 2] = 255; }
        else { d[i] = Math.max(0, d[i] * 0.75); d[i + 1] = Math.max(0, d[i + 1] * 0.75); d[i + 2] = Math.max(0, d[i + 2] * 0.75); }
      }
      ctx.putImageData(id, 0, 0);
      c.toBlob(b => setOutput(b, 'solvrik_ink_saver.jpg'), 'image/jpeg', 0.93);
    }
    function runTransSign() {
      if (!docImg) return;
      const c = document.createElement('canvas'); c.width = docImg.width; c.height = docImg.height;
      const ctx = c.getContext('2d'); ctx.drawImage(docImg, 0, 0);
      const id = ctx.getImageData(0, 0, c.width, c.height), d = id.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (g > 165) { d[i + 3] = 0; }
        else { d[i] = Math.round(d[i] * 0.65); d[i + 1] = Math.round(d[i + 1] * 0.65); d[i + 2] = Math.round(d[i + 2] * 0.65); d[i + 3] = 255; }
      }
      ctx.putImageData(id, 0, 0);
      c.toBlob(b => setOutput(b, 'signature_transparent.png'), 'image/png');
    }
    function runCustomResize() {
      if (!docImg) return;
      const nw = Math.max(16, Math.min(4500, parseInt(document.getElementById('rs-w').value, 10) || docImg.width));
      const nh = Math.max(16, Math.min(4500, parseInt(document.getElementById('rs-h').value, 10) || docImg.height));
      const c = document.createElement('canvas'); c.width = nw; c.height = nh;
      c.getContext('2d').drawImage(docImg, 0, 0, nw, nh);
      c.toBlob(b => setOutput(b, `resized_${nw}x${nh}.jpg`), 'image/jpeg', 0.94);
    }
    function runWatermark() {
      if (!docImg) return;
      const txt = document.getElementById('wm-text').value.trim() || '@SolvrikHQ';
      const c = document.createElement('canvas'); c.width = docImg.width; c.height = docImg.height;
      const ctx = c.getContext('2d'); ctx.drawImage(docImg, 0, 0);
      const fs = Math.max(28, Math.round(c.width / 14));
      ctx.font = `bold ${fs}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
      ctx.save(); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(-0.45);
      for (let y = -c.height; y < c.height; y += fs * 3.5) for (let x = -c.width; x < c.width; x += fs * 7) { ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y); }
      ctx.restore();
      c.toBlob(b => setOutput(b, 'watermarked.jpg'), 'image/jpeg', 0.93);
    }

    // ================= 6. MULTI-PHOTO: ID JOIN, COLLAGE, GRID & STICKER =================
    let multiImgs = [];
    function loadMultiSoc(e) {
      const files = Array.from(e.target.files || []).slice(0, 4);
      if (!files.length) return;
      multiImgs = [];
      let loaded = 0;
      files.forEach(f => {
        const im = new Image();
        im.onload = () => {
          multiImgs.push(im); loaded++;
          if (loaded === files.length) {
            document.getElementById('soc-ui').classList.remove('hidden');
            document.getElementById('soc-count').textContent = `✅ ${multiImgs.length} photo(s) selected.`;
          }
        };
        im.src = URL.createObjectURL(f);
      });
    }
    function runIdJoin() {
      if (multiImgs.length < 2) { alert('Front aur Back dono (2 photos) ek saath chunein!'); return; }
      const a = multiImgs[0], b = multiImgs[1], tw = 1000, pad = 40;
      const h1 = Math.round(a.height * tw / a.width), h2 = Math.round(b.height * tw / b.width);
      const c = document.createElement('canvas'); c.width = tw + pad * 2; c.height = h1 + h2 + pad * 3;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(a, pad, pad, tw, h1); ctx.drawImage(b, pad, h1 + pad * 2, tw, h2);
      c.toBlob(bl => setOutput(bl, 'id_card_joined.jpg'), 'image/jpeg', 0.93);
    }
    function runCollage() {
      if (multiImgs.length < 2) { alert('Kam se kam 2 photos chunein!'); return; }
      const gap = 20, sz = 750;
      const c = document.createElement('canvas');
      if (multiImgs.length === 2) {
        c.width = sz * 2 + gap * 3; c.height = sz + gap * 2;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        [multiImgs[0], multiImgs[1]].forEach((im, i) => {
          const m = Math.min(im.width, im.height);
          ctx.drawImage(im, (im.width - m)/2, (im.height - m)/2, m, m, gap + i * (sz + gap), gap, sz, sz);
        });
      } else {
        c.width = sz * 2 + gap * 3; c.height = sz * 2 + gap * 3;
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        multiImgs.slice(0, 4).forEach((im, i) => {
          const m = Math.min(im.width, im.height), r = Math.floor(i / 2), col = i % 2;
          ctx.drawImage(im, (im.width - m)/2, (im.height - m)/2, m, m, gap + col * (sz + gap), gap + r * (sz + gap), sz, sz);
        });
      }
      c.toBlob(bl => setOutput(bl, 'solvrik_collage.jpg'), 'image/jpeg', 0.93);
    }
    function runSticker() {
      if (!multiImgs.length) return;
      const im = multiImgs[0], s = 512 / Math.max(im.width, im.height);
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(bl => setOutput(bl, 'telegram_sticker.webp'), 'image/webp', 0.92);
    }
    function runInstaGrid() {
      if (!multiImgs.length) return;
      const im = multiImgs[0], minS = Math.min(im.width, im.height);
      const sx = Math.round((im.width - minS) / 2), sy = Math.round((im.height - minS) / 2);
      const cw = Math.floor(minS / 3), box = document.getElementById('grid-out'); box.innerHTML = '';
      const tile = document.createElement('canvas'); tile.width = cw; tile.height = cw;
      const tctx = tile.getContext('2d');
      let idx = 1;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        tctx.drawImage(im, sx + c * cw, sy + r * cw, cw, cw, 0, 0, cw, cw);
        const url = tile.toDataURL('image/jpeg', 0.94);
        const wrap = document.createElement('div'); wrap.style.width = '30%';
        wrap.innerHTML = `<img src="${url}" style="border-radius:6px;border:1px solid #334155"/><div style="font-size:11px;text-align:center;color:#94a3b8">#${idx}</div>`;
        box.appendChild(wrap); idx++;
      }
    }
  </script>
</body>
