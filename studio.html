<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solvrik Pro Studio — All-in-One Visual Suite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { --bg: #0b1120; --card: #162032; --accent: #3b82f6; --green: #10b981; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 30px; }
    .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .hdr h2 { margin: 0; font-size: 17px; }
    .badge { background: #1d4ed8; font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; padding: 9px 12px; border: 1px solid #263349; border-radius: 10px; background: var(--card); color: var(--muted); font-weight: 600; font-size: 12.5px; cursor: pointer; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .card { background: var(--card); border-radius: 14px; padding: 14px; border: 1px solid #223047; }
    .upload-box { border: 2px dashed #3b82f688; border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; display: block; background: #0f172a; }
    .upload-box span { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
    input[type="file"] { display: none; }
    .img-wrap { max-height: 320px; overflow: hidden; border-radius: 10px; background: #020617; margin-top: 10px; display: flex; justify-content: center; align-items: center; }
    img, canvas { max-width: 100%; max-height: 320px; display: block; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 85px; padding: 11px 8px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn.sec { background: #263349; }
    .btn.green { background: var(--green); }
    input[type="number"], input[type="text"], select { width: 100%; padding: 10px; border-radius: 9px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13.5px; margin-top: 8px; }
    .pill { padding: 7px 11px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 12px; cursor: pointer; }
    .pill.on { background: var(--accent); border-color: var(--accent); }
    .info { font-size: 13px; color: #38bdf8; margin-top: 8px; font-weight: 600; word-break: break-word; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="hdr">
    <h2>⚡ Solvrik Pro Studio</h2>
    <span class="badge">Zero-Lag Device Engine</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('crop', this)">✂️ Crop & Scan</button>
    <button class="tab" onclick="switchTab('kb', this)">📦 Exact KB</button>
    <button class="tab" onclick="switchTab('pass', this)">🪪 Passport & Exam</button>
    <button class="tab" onclick="switchTab('fx', this)">🎨 Filters & DP</button>
    <button class="tab" onclick="switchTab('soc', this)">📱 Social & QR</button>
  </div>

  <!-- 1. INTERACTIVE CROP & DOC SCAN -->
  <div id="tab-crop" class="card">
    <label class="upload-box">
      📸 <b>Card / Document / Photo chunein</b>
      <span>4-Corner Manual Adjust + Auto B&W Scan</span>
      <input type="file" accept="image/*" onchange="loadCrop(event)" />
    </label>
    <div id="crop-ui" class="hidden">
      <div class="img-wrap"><img id="crop-img" /></div>
      <div class="row">
        <button class="pill" onclick="setCropRatio(NaN)">Free</button>
        <button class="pill" onclick="setCropRatio(85.6/54)">ID Card</button>
        <button class="pill" onclick="setCropRatio(1)">1:1</button>
        <button class="pill" onclick="setCropRatio(4/5)">4:5</button>
        <button class="pill" onclick="setCropRatio(16/9)">16:9</button>
      </div>
      <div class="row">
        <button class="btn sec" onclick="cropper.rotate(-90)">↺ 90°</button>
        <button class="btn sec" onclick="cropper.rotate(90)">↻ 90°</button>
        <button class="btn sec" onclick="flipCrop()">⇄ Flip</button>
        <button class="btn sec" onclick="cropper.reset()">Reset</button>
      </div>
      <div class="row">
        <button class="btn" onclick="exportCrop('color')">✂️ Save Color Crop</button>
        <button class="btn green" onclick="exportCrop('bw')">📄 Save B&W Scan</button>
      </div>
    </div>
  </div>

  <!-- 2. EXACT KB / MB COMPRESSOR -->
  <div id="tab-kb" class="card hidden">
    <label class="upload-box">
      🖼️ <b>Photo chunein (Exact KB / MB Size)</b>
      <span>Live Quality & Resolution Preview</span>
      <input type="file" accept="image/*" onchange="loadKb(event)" />
    </label>
    <div id="kb-ui" class="hidden">
      <div class="row">
        <button class="pill" onclick="setKb(10)">10 KB</button>
        <button class="pill" onclick="setKb(20)">20 KB</button>
        <button class="pill" onclick="setKb(50)">50 KB</button>
        <button class="pill" onclick="setKb(100)">100 KB</button>
        <button class="pill" onclick="setKb(200)">200 KB</button>
        <button class="pill" onclick="setKb(1024)">1 MB</button>
      </div>
      <input type="number" id="kb-val" value="20" min="3" max="10000" placeholder="Custom KB (e.g. 35)" />
      <button class="btn" style="width:100%;margin-top:8px" onclick="runKb()">⚡ Compress to Exact Size</button>
      <div id="kb-stat" class="info"></div>
      <div class="img-wrap"><img id="kb-prev" /></div>
      <button id="kb-dl" class="btn green hidden" style="width:100%;margin-top:10px" onclick="saveBlob(kbBlob, 'solvrik_exact_size.jpg')">⬇️ Download Photo</button>
    </div>
  </div>

  <!-- 3. PASSPORT, A4 SHEET & EXAM PRESETS -->
  <div id="tab-pass" class="card hidden">
    <label class="upload-box">
      🪪 <b>Selfie / Portrait / Signature chunein</b>
      <span>35×45mm Passport, A4 Sheet & SSC/UPSC/JEE Presets</span>
      <input type="file" accept="image/*" onchange="loadPass(event)" />
    </label>
    <div id="pass-ui" class="hidden">
      <div class="img-wrap"><img id="pass-img" /></div>
      <select id="pass-mode" onchange="updatePassAspect()">
        <option value="single">Single Passport (35×45mm, 300 DPI)</option>
        <option value="a4_6">A4 Print Sheet — 6 Photos (1 Row)</option>
        <option value="a4_12">A4 Print Sheet — 12 Photos (2 Rows)</option>
        <option value="a4_30">A4 Print Sheet — 30 Photos (5 Rows)</option>
        <option value="ssc">SSC / Bank / Railway Preset (20–50 KB)</option>
        <option value="upsc">UPSC Preset (Square 500×500, ≤180 KB)</option>
        <option value="jee">JEE / NEET Preset (35×45mm, ≤95 KB)</option>
        <option value="sign">Exam Signature Preset (280×120, ≤18 KB)</option>
      </select>
      <input type="text" id="pass-label" placeholder="Optional Name | Date (e.g. Amit Kumar | 28/11/2026)" />
      <button class="btn green" style="width:100%;margin-top:10px" onclick="runPassport()">🪪 Generate & Download</button>
      <div id="pass-stat" class="info"></div>
    </div>
  </div>

  <!-- 4. FILTERS, BORDERS & DP MAKER -->
  <div id="tab-fx" class="card hidden">
    <label class="upload-box">
      🎨 <b>Photo chunein (Enhance, Filters & DP)</b>
      <span>Auto HD, Circular DP, No-Crop Blur DP & Borders</span>
      <input type="file" accept="image/*" onchange="loadFx(event)" />
    </label>
    <div id="fx-ui" class="hidden">
      <div class="img-wrap"><canvas id="fx-canvas"></canvas></div>
      <div class="row">
        <button class="pill" onclick="applyFx('orig')">Original</button>
        <button class="pill" onclick="applyFx('enhance')">✨ Auto HD</button>
        <button class="pill" onclick="applyFx('bw')">⚫ B&W</button>
        <button class="pill" onclick="applyFx('vintage')">🎞️ Vintage</button>
        <button class="pill" onclick="applyFx('blur')">💧 Blur</button>
      </div>
      <div class="row">
        <button class="pill" onclick="applyFx('wborder')">⬜ White Border</button>
        <button class="pill" onclick="applyFx('bborder')">⬛ Black Border</button>
        <button class="pill" onclick="applyFx('nocrop')">🖼️ No-Crop DP</button>
        <button class="pill" onclick="applyFx('circle')">🔵 Circular DP</button>
      </div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="saveFx()">⬇️ Download Result</button>
    </div>
  </div>

  <!-- 5. SOCIAL TOOLS & QR SCANNER -->
  <div id="tab-soc" class="card hidden">
    <label class="upload-box">
      📱 <b>Photo ya QR Code chunein</b>
      <span>Insta 3×3 Grid ZIP, TG 512px Sticker, Watermark & QR Scan</span>
      <input type="file" accept="image/*" onchange="loadSoc(event)" />
    </label>
    <div id="soc-ui" class="hidden">
      <div class="img-wrap"><img id="soc-img" /></div>
      <input type="text" id="wm-text" placeholder="Watermark text (e.g. @SolvrikHQ)" />
      <div class="row">
        <button class="btn" onclick="runWatermark()">💧 Watermark</button>
        <button class="btn sec" onclick="runSticker()">🎭 TG Sticker (512px)</button>
      </div>
      <div class="row">
        <button class="btn sec" onclick="runInstaGrid(3)"> 🧩 Insta 3×3 ZIP</button>
        <button class="btn sec" onclick="runInstaGrid(1)">🎞️ Insta 3×1 ZIP</button>
        <button class="btn green" onclick="runQrScan()">📷 Scan QR</button>
      </div>
      <div id="soc-stat" class="info"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let cropper = null, flipX = 1, kbImg = null, kbBlob = null;
    let passCropper = null, fxImg = null, fxIsPng = false, socImg = null;

    function switchTab(id, btn) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['crop', 'kb', 'pass', 'fx', 'soc'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== id));
    }

    function saveBlob(blob, name) {
      if (!blob) return;
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }

    // ---- 1. CROP & SCAN ----
    function loadCrop(e) {
      const f = e.target.files[0]; if (!f) return;
      const img = document.getElementById('crop-img');
      img.src = URL.createObjectURL(f);
      document.getElementById('crop-ui').classList.remove('hidden');
      flipX = 1;
      if (cropper) cropper.destroy();
      cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.78, responsive: true });
    }
    function setCropRatio(r) { if (cropper) cropper.setAspectRatio(r); }
    function flipCrop() { if (!cropper) return; flipX *= -1; cropper.scaleX(flipX); }
    function exportCrop(mode) {
      if (!cropper) return;
      const c = cropper.getCroppedCanvas({ maxWidth: 2400, maxHeight: 2400, imageSmoothingQuality: 'high' });
      if (mode === 'bw') {
        const ctx = c.getContext('2d'), d = ctx.getImageData(0, 0, c.width, c.height);
        for (let i = 0; i < d.data.length; i += 4) {
          const g = 0.299 * d.data[i] + 0.587 * d.data[i+1] + 0.114 * d.data[i+2];
          const v = g > 142 ? 255 : Math.max(0, (g - 35) * 1.4);
          d.data[i] = d.data[i+1] = d.data[i+2] = v;
        }
        ctx.putImageData(d, 0, 0);
      }
      c.toBlob(b => saveBlob(b, mode === 'bw' ? 'solvrik_doc_scan.jpg' : 'solvrik_crop.jpg'), 'image/jpeg', 0.94);
    }

    // ---- 2. EXACT KB ----
    function setKb(v) { document.getElementById('kb-val').value = v; runKb(); }
    function loadKb(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { kbImg = im; document.getElementById('kb-ui').classList.remove('hidden'); runKb(); };
      im.src = URL.createObjectURL(f);
    }
    async function compressCanvasToBytes(srcCanvas, targetBytes) {
      let w = srcCanvas.width, h = srcCanvas.height;
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      let best = null, bq = 0.8;
      for (let s = 0; s < 9; s++) {
        c.width = w; c.height = h;
        ctx.drawImage(srcCanvas, 0, 0, w, h);
        let lo = 0.20, hi = 0.94;
        for (let i = 0; i < 6; i++) {
          const mid = (lo + hi) / 2;
          const b = await new Promise(r => c.toBlob(r, 'image/jpeg', mid));
          if (b.size <= targetBytes) { best = b; bq = mid; lo = mid; } else { hi = mid; }
        }
        if (best) return { blob: best, w, h, q: bq };
        w = Math.max(200, Math.round(w * 0.78));
        h = Math.max(200, Math.round(h * 0.78));
      }
      const fb = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.18));
      return { blob: fb, w, h, q: 0.18 };
    }
    async function runKb() {
      if (!kbImg) return;
      const targetBytes = Math.max(3, parseFloat(document.getElementById('kb-val').value || 20)) * 1024;
      let w = kbImg.width, h = kbImg.height;
      if (Math.max(w, h) > 1200) { const s = 1200 / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const base = document.createElement('canvas'); base.width = w; base.height = h;
      base.getContext('2d').drawImage(kbImg, 0, 0, w, h);
      const res = await compressCanvasToBytes(base, targetBytes);
      kbBlob = res.blob;
      document.getElementById('kb-prev').src = URL.createObjectURL(res.blob);
      document.getElementById('kb-stat').textContent = `✅ Ready: ${(res.blob.size / 1024).toFixed(1)} KB | ${res.w}×${res.h} px | Q${Math.round(res.q * 100)}%`;
      document.getElementById('kb-dl').classList.remove('hidden');
    }

    // ---- 3. PASSPORT, A4 & EXAM PRESETS ----
    function loadPass(e) {
      const f = e.target.files[0]; if (!f) return;
      const img = document.getElementById('pass-img');
      img.src = URL.createObjectURL(f);
      document.getElementById('pass-ui').classList.remove('hidden');
      if (passCropper) passCropper.destroy();
      passCropper = new Cropper(img, { aspectRatio: 35 / 45, viewMode: 1, autoCropArea: 0.85 });
    }
    function updatePassAspect() {
      if (!passCropper) return;
      const m = document.getElementById('pass-mode').value;
      if (m === 'upsc') passCropper.setAspectRatio(1);
      else if (m === 'sign') passCropper.setAspectRatio(280 / 120);
      else passCropper.setAspectRatio(35 / 45);
    }
    async function runPassport() {
      if (!passCropper) return;
      const mode = document.getElementById('pass-mode').value;
      const label = document.getElementById('pass-label').value.trim();

      if (mode === 'sign') {
        const sc = passCropper.getCroppedCanvas({ width: 280, height: 120 });
        const res = await compressCanvasToBytes(sc, 18 * 1024);
        document.getElementById('pass-stat').textContent = `✅ Signature Ready (${(res.blob.size/1024).toFixed(1)} KB)`;
        saveBlob(res.blob, 'exam_signature.jpg'); return;
      }
      if (mode === 'upsc' || mode === 'ssc' || mode === 'jee') {
        const dims = mode === 'upsc' ? [500, 500, 180] : (mode === 'jee' ? [413, 531, 95] : [350, 450, 45]);
        const c = passCropper.getCroppedCanvas({ width: dims[0], height: dims[1] });
        const res = await compressCanvasToBytes(c, dims[2] * 1024);
        document.getElementById('pass-stat').textContent = `✅ ${mode.toUpperCase()} Ready (${(res.blob.size/1024).toFixed(1)} KB)`;
        saveBlob(res.blob, `${mode}_photo.jpg`); return;
      }

      const crop = passCropper.getCroppedCanvas({ width: 413, height: 531 });
      const tile = document.createElement('canvas');
      tile.width = 419; tile.height = (label ? 610 : 531) + 6;
      const tctx = tile.getContext('2d');
      tctx.fillStyle = '#222'; tctx.fillRect(0, 0, tile.width, tile.height);
      tctx.fillStyle = '#fff'; tctx.fillRect(3, 3, tile.width - 6, tile.height - 6);
      tctx.drawImage(crop, 3, 3);
      if (label) {
        tctx.fillStyle = '#000'; tctx.fillRect(3, 534, 413, 2);
        const parts = label.split('|').map(s => s.trim());
        tctx.font = 'bold 22px sans-serif'; tctx.textAlign = 'center';
        tctx.fillText(parts[0].slice(0, 24), 209, 565);
        if (parts[1]) { tctx.font = '18px sans-serif'; tctx.fillText(parts[1].slice(0, 24), 209, 594); }
      }

      if (mode === 'single') {
        tile.toBlob(b => saveBlob(b, 'passport_single.jpg'), 'image/jpeg', 0.95);
        return;
      }
      const rows = mode === 'a4_6' ? 1 : (mode === 'a4_12' ? 2 : 5);
      const cols = 6;
      const a4 = document.createElement('canvas'); a4.width = 2480; a4.height = 3508;
      const actx = a4.getContext('2d');
      actx.fillStyle = '#fff'; actx.fillRect(0, 0, 2480, 3508);
      const tw = 375, th = Math.round(tw * tile.height / tile.width), gap = 24;
      const sx = Math.round((2480 - (cols * tw + (cols - 1) * gap)) / 2);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          actx.drawImage(tile, sx + c * (tw + gap), 70 + r * (th + 28), tw, th);
        }
      }
      a4.toBlob(b => saveBlob(b, `a4_${rows*cols}_photos.jpg`), 'image/jpeg', 0.95);
    }

    // ---- 4. FILTERS & DP ----
    function loadFx(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { fxImg = im; document.getElementById('fx-ui').classList.remove('hidden'); applyFx('orig'); };
      im.src = URL.createObjectURL(f);
    }
    function applyFx(type) {
      if (!fxImg) return;
      const c = document.getElementById('fx-canvas'), ctx = c.getContext('2d');
      fxIsPng = (type === 'circle');
      let w = fxImg.width, h = fxImg.height;
      if (Math.max(w, h) > 1200) { const s = 1200 / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }

      if (type === 'nocrop' || type === 'circle') {
        const side = Math.max(w, h);
        c.width = side; c.height = side;
        ctx.clearRect(0, 0, side, side);
        if (type === 'nocrop') {
          ctx.filter = 'blur(22px) brightness(0.85)';
          ctx.drawImage(fxImg, -30, -30, side + 60, side + 60);
          ctx.filter = 'none';
          ctx.drawImage(fxImg, (side - w) / 2, (side - h) / 2, w, h);
        } else {
          ctx.save();
          ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - 14, 0, Math.PI * 2); ctx.clip();
          const minS = Math.min(fxImg.width, fxImg.height);
          ctx.drawImage(fxImg, (fxImg.width - minS)/2, (fxImg.height - minS)/2, minS, minS, 0, 0, side, side);
          ctx.restore();
          ctx.lineWidth = Math.max(12, side / 36); ctx.strokeStyle = '#3b82f6';
          ctx.beginPath(); ctx.arc(side/2, side/2, side/2 - ctx.lineWidth/2, 0, Math.PI * 2); ctx.stroke();
        }
        return;
      }

      if (type === 'wborder' || type === 'bborder') {
        const bw = Math.max(24, Math.round(Math.min(w, h) / 18));
        c.width = w + bw * 2; c.height = h + bw * 2;
        ctx.fillStyle = type === 'wborder' ? '#ffffff' : '#000000';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(fxImg, bw, bw, w, h);
        return;
      }

      c.width = w; c.height = h;
      ctx.filter = type === 'enhance' ? 'contrast(1.18) saturate(1.15) brightness(1.04)'
                 : type === 'bw' ? 'grayscale(1) contrast(1.15)'
                 : type === 'vintage' ? 'sepia(0.65) contrast(1.1)'
                 : type === 'blur' ? 'blur(5px)' : 'none';
      ctx.drawImage(fxImg, 0, 0, w, h);
      ctx.filter = 'none';
    }
    function saveFx() {
      const c = document.getElementById('fx-canvas');
      c.toBlob(b => saveBlob(b, fxIsPng ? 'solvrik_circle_dp.png' : 'solvrik_edited.jpg'), fxIsPng ? 'image/png' : 'image/jpeg', 0.94);
    }

    // ---- 5. SOCIAL & QR ----
    function loadSoc(e) {
      const f = e.target.files[0]; if (!f) return;
      const im = new Image();
      im.onload = () => { socImg = im; document.getElementById('soc-ui').classList.remove('hidden'); document.getElementById('soc-img').src = im.src; };
      im.src = URL.createObjectURL(f);
    }
    function runWatermark() {
      if (!socImg) return;
      const txt = document.getElementById('wm-text').value.trim() || '@SolvrikHQ';
      const c = document.createElement('canvas'); c.width = socImg.width; c.height = socImg.height;
      const ctx = c.getContext('2d'); ctx.drawImage(socImg, 0, 0);
      const fs = Math.max(28, Math.round(c.width / 14));
      ctx.font = `bold ${fs}px sans-serif`; ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
      ctx.save(); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(-0.45);
      for (let y = -c.height; y < c.height; y += fs * 3.5) {
        for (let x = -c.width; x < c.width; x += fs * 7) { ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y); }
      }
      ctx.restore();
      c.toBlob(b => saveBlob(b, 'watermarked.jpg'), 'image/jpeg', 0.93);
    }
    function runSticker() {
      if (!socImg) return;
      const s = 512 / Math.max(socImg.width, socImg.height);
      const c = document.createElement('canvas');
      c.width = Math.round(socImg.width * s); c.height = Math.round(socImg.height * s);
      c.getContext('2d').drawImage(socImg, 0, 0, c.width, c.height);
      c.toBlob(b => saveBlob(b, 'telegram_sticker.webp'), 'image/webp', 0.92);
    }
    async function runInstaGrid(rows) {
      if (!socImg || typeof JSZip === 'undefined') return;
      const cols = 3, targetRatio = cols / rows;
      let sw = socImg.width, sh = socImg.height, sx = 0, sy = 0;
      if (sw / sh > targetRatio) { sw = Math.round(sh * targetRatio); sx = Math.round((socImg.width - sw) / 2); }
      else { sh = Math.round(sw / targetRatio); sy = Math.round((socImg.height - sh) / 2); }
      const cw = Math.floor(sw / cols), ch = Math.floor(sh / rows);
      const zip = new JSZip(), tile = document.createElement('canvas');
      tile.width = cw; tile.height = ch;
      const tctx = tile.getContext('2d');
      let idx = 1;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          tctx.drawImage(socImg, sx + c * cw, sy + r * ch, cw, ch, 0, 0, cw, ch);
          const blob = await new Promise(res => tile.toBlob(res, 'image/jpeg', 0.94));
          zip.file(`grid_${idx}_r${r+1}c${c+1}.jpg`, blob); idx++;
        }
      }
      const zblob = await zip.generateAsync({ type: 'blob' });
      saveBlob(zblob, `insta_grid_${cols}x${rows}.zip`);
    }
    function runQrScan() {
      if (!socImg || typeof jsQR === 'undefined') return;
      const c = document.createElement('canvas'), s = Math.min(1, 1000 / Math.max(socImg.width, socImg.height));
      c.width = Math.round(socImg.width * s); c.height = Math.round(socImg.height * s);
      const ctx = c.getContext('2d'); ctx.drawImage(socImg, 0, 0, c.width, c.height);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      document.getElementById('soc-stat').textContent = code ? `✅ QR Data: ${code.data}` : '❌ QR code nahi mila — clear photo chunein.';
    }
  </script>
</body>
