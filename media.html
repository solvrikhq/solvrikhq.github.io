<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Solvrik Media Studio — Upgraded Version ⚡</title>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  <style>
    :root {
      --bg: #070d19;
      --surface: #11192c;
      --surface-2: #18233c;
      --border: rgba(148, 163, 184, 0.18);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --green: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: radial-gradient(circle at top right, #132240 0%, var(--bg) 55%);
      color: var(--text);
      padding: 14px;
      padding-bottom: 52px;
      min-height: 100vh;
    }

    .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .hdr-title { display: flex; align-items: center; gap: 8px; }
    .hdr-logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6, #10b981);
      display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .hdr h2 { margin: 0; font-size: 16px; letter-spacing: -0.2px; }
    .badge {
      background: rgba(16, 185, 129, 0.16);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      font-size: 10.5px; padding: 4px 9px; border-radius: 20px; font-weight: 700;
    }

    .pbar-wrap { width: 100%; height: 4px; background: #1e293b; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
    .pbar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #3b82f6, #10b981); }

    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .tab {
      padding: 11px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.18s ease;
    }
    .tab.active {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    .upload-box {
      border: 2px dashed rgba(59, 130, 246, 0.55);
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      cursor: pointer;
      display: block;
      background: rgba(15, 23, 42, 0.72);
    }
    .upload-box:active { background: rgba(59, 130, 246, 0.12); border-color: #60a5fa; }
    .upload-box b { font-size: 14px; color: #f1f5f9; }
    .upload-box span { display: block; font-size: 12px; color: var(--muted); margin-top: 5px; }
    input[type="file"] { display: none; }

    .media-box {
      margin-top: 12px;
      background: #040812;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video, img, audio { max-width: 100%; max-height: 300px; display: block; border-radius: 8px; }

    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .col-stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .btn {
      flex: 1; min-width: 110px; padding: 12px 12px;
      border: none; border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff; font-weight: 600; font-size: 13.5px;
      cursor: pointer; text-align: center; text-decoration: none; display: inline-block;
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
    }
    .btn.sec { background: var(--surface-2); box-shadow: none; border: 1px solid var(--border); color: #e2e8f0; }
    .btn.green { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 3px 10px rgba(16, 185, 129, 0.28); }
    .btn.sm { flex: 0 0 auto; min-width: 46px; padding: 8px 12px; font-size: 14px; font-weight: 700; }
    .btn:active { transform: scale(0.97); }

    input[type="number"], input[type="text"], select {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: #0b1222;
      color: #fff; font-size: 13.5px; margin-top: 8px; outline: none;
    }
    input[type="range"] { width: 100%; margin-top: 6px; accent-color: #3b82f6; }
    .slider-lbl { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    .pill {
      padding: 7px 12px; border-radius: 20px;
      border: 1px solid var(--border); background: #0b1222;
      color: #cbd5e1; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .pill.on { background: var(--accent); border-color: #60a5fa; color: #fff; }
    .info { font-size: 13px; color: #38bdf8; margin-top: 8px; font-weight: 600; word-break: break-word; line-height: 1.45; }
    .hidden { display: none !important; }

    #out-box {
      margin-bottom: 14px;
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.14), var(--surface));
      border: 1.5px solid #10b981;
      border-radius: 14px;
      padding: 13px;
      text-align: center;
    }
    .yt-card {
      margin-top: 12px; background: #0b1222; border: 1px solid var(--border);
      border-radius: 12px; padding: 11px;
    }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="hdr-title">
      <div class="hdr-logo">S</div>
      <div>
        <h2>Solvrik Media Studio ⚡</h2>
        <div style="font-size:11px;color:#34d399;font-weight:600">Upgraded Version • Device Engine</div>
      </div>
    </div>
    <span class="badge">Upgraded ⚡</span>
  </div>
  <div class="pbar-wrap"><div class="pbar-fill"></div></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('yt', this)">📥 Link Downloader ⚡</button>
    <button class="tab" onclick="switchTab('aud', this)">🎵 Video → Audio ⚡</button>
    <button class="tab" onclick="switchTab('trim', this)">✂️ Trim & Compress ⚡</button>
    <button class="tab" onclick="switchTab('vcrop', this)">📐 Ratio Crop & Speed ⚡</button>
    <button class="tab" onclick="switchTab('afx', this)">🎧 Audio Speed & Boost ⚡</button>
    <button class="tab" onclick="switchTab('info', this)">📸 HD Frame & Info ⚡</button>
  </div>

  <!-- OUTPUT BOX -->
  <div id="out-box" class="hidden">
    <div id="out-title" style="font-size:13.5px;font-weight:700;color:#34d399;margin-bottom:8px">✅ File Ready!</div>
    <div id="out-preview"></div>
    <div class="row">
      <button class="btn green" onclick="smartSaveAction()">⬇️ Direct Save / Share</button>
      <button class="btn" onclick="openFileTab()">🖼️ Open Full File</button>
      <button class="btn sec sm" onclick="document.getElementById('out-box').classList.add('hidden')">✖️</button>
    </div>
  </div>

  <!-- 1. UPGRADED LINK & YOUTUBE TOOL -->
  <div id="tab-yt" class="card">
    <div style="font-size:13.5px;color:#e2e8f0;font-weight:600">🔗 YouTube Video / Shorts Link Paste Karein:</div>
    <div class="row" style="margin-top:6px">
      <input type="text" id="yt-url" style="flex:1;margin-top:0" placeholder="https://youtu.be/... ya https://youtube.com/shorts/..." oninput="onYtInput()" />
      <button class="btn sec sm" onclick="pasteYtUrl()">📋 Paste</button>
    </div>
    <button class="btn" style="width:100%;margin-top:10px" onclick="fetchYtStreams()">⚡ Load Video, Thumbnail & Options</button>
    <div id="yt-stat" class="info"></div>

    <div id="yt-result" class="yt-card hidden">
      <img id="yt-thumb-prev" style="width:100%;border-radius:9px;margin-bottom:8px" />
      <div id="yt-meta-title" style="font-size:13.5px;font-weight:700;color:#f8fafc;margin-bottom:8px"></div>
      <div id="yt-player-wrap" class="hidden" style="margin-bottom:10px">
        <video id="yt-direct-player" controls playsinline style="width:100%;border-radius:9px"></video>

        <button class="btn sec" onclick="grabYtThumb(currentYtId)">🖼️ Download 1080p HD Thumbnail</button>
        <a class="btn sec" href="https://solvrikhq.github.io" target="_blank" rel="noopener">📱 Get Solvrik App (Direct Download Engine)</a>
      </div>

  </div>

  <!-- 2. VIDEO TO AUDIO -->
  <div id="tab-aud" class="card hidden">
    <label class="upload-box">
      🎥 <b>Video chunein (500 MB tak — Upgraded Version ⚡)</b>
      <span>High-Quality Stereo Audio Extraction directly on your device</span>
      <input type="file" accept="video/*" onchange="loadAudVid(event)" />
    </label>
    <div id="aud-ui" class="hidden">
      <div class="media-box"><video id="aud-vid" controls playsinline></video></div>
      <div id="aud-stat" class="info"></div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="extractAudioNow()">🎵 Extract HD Audio (WAV)</button>
    </div>
  </div>

  <!-- 3. TRIM & COMPRESS -->
  <div id="tab-trim" class="card hidden">
    <label class="upload-box">
      🎞️ <b>Video chunein (Trim / Compress / Mute ⚡)</b>
      <span>Exact Start–End Seconds + Resolution & Audio Control</span>
      <input type="file" accept="video/*" onchange="loadTrimVid(event)" />
    </label>
    <div id="trim-ui" class="hidden">
      <div class="media-box"><video id="trim-vid" controls playsinline></video></div>
      <div class="row">
        <input type="number" id="t-start" value="0" min="0" step="1" placeholder="Start sec" style="flex:1;margin-top:0" />
        <input type="number" id="t-end" value="15" min="1" step="1" placeholder="End sec" style="flex:1;margin-top:0" />
      </div>
      <select id="trim-q">
        <option value="0.40">360p Ultra-Light (Minimum MB)</option>
        <option value="0.55">480p Fast Share (WhatsApp/TG)</option>
        <option value="0.75" selected>720p Balanced HD</option>
        <option value="1.0">Original HD Resolution</option>
      </select>
      <select id="trim-mute">
        <option value="keep" selected>🔊 Keep Original Audio</option>
        <option value="mute">🔇 Mute Audio (No Sound)</option>
      </select>
      <button class="btn" style="width:100%;margin-top:10px" onclick="processTrimCompress()">⚡ Process & Export Video</button>
      <div id="trim-stat" class="info"></div>
    </div>
  </div>

  <!-- 4. RATIO CROP & SPEED -->
  <div id="tab-vcrop" class="card hidden">
    <label class="upload-box">
      📐 <b>Video chunein (Reels 9:16 • 1:1 • Speed ⚡)</b>
      <span>Crop Video to Social Ratio + 0.5x to 2.0x Playback Speed</span>
      <input type="file" accept="video/*" onchange="loadCropVid(event)" />
    </label>
    <div id="vcrop-ui" class="hidden">
      <div class="media-box"><video id="vcrop-vid" controls playsinline></video></div>
      <div class="row">
        <button class="pill on" onclick="setVidRatio('orig', this)">Original</button>
        <button class="pill" onclick="setVidRatio('9:16', this)">9:16 Reels</button>
        <button class="pill" onclick="setVidRatio('1:1', this)">1:1 Square</button>
        <button class="pill" onclick="setVidRatio('4:5', this)">4:5 Insta</button>
        <button class="pill" onclick="setVidRatio('16:9', this)">16:9 YT</button>

      <div class="slider-lbl">
        <span>⚡ Video Speed</span>
        <b id="vspd-val" style="color:#38bdf8">1.0x</b>

      <input type="range" id="vspd-slider" min="0.5" max="2.0" step="0.25" value="1.0" oninput="document.getElementById('vspd-val').textContent=this.value+'x'" />
      <button class="btn green" style="width:100%;margin-top:10px" onclick="exportRatioSpeedVideo()">🎬 Export Ratio / Speed Video</button>
      <div id="vcrop-stat" class="info"></div>
    </div>
  </div>

  <!-- 5. AUDIO FX -->
  <div id="tab-afx" class="card hidden">
    <label class="upload-box">
      🎧 <b>Audio / MP3 / Song chunein (Upgraded ⚡)</b>
      <span>Slowed + Reverb Lo-Fi, Speed Changer & +250% Volume Booster</span>
      <input type="file" accept="audio/*,video/*" onchange="loadAudioFx(event)" />
    </label>
    <div id="afx-ui" class="hidden">
      <div id="afx-name" class="info"></div>
      <div class="slider-lbl">
        <span>🎚️ Playback Speed / Pitch</span>
        <b id="aspd-val" style="color:#38bdf8">1.00x</b>
      </div>
      <input type="range" id="aspd-slider" min="0.65" max="1.75" step="0.05" value="1.0" oninput="document.getElementById('aspd-val').textContent=parseFloat(this.value).toFixed(2)+'x'" />

      <div class="slider-lbl">
        <span>🔊 Volume Gain Boost</span>
        <b id="avol-val" style="color:#38bdf8">100%</b>
      </div>
      <input type="range" id="avol-slider" min="50" max="250" step="10" value="100" oninput="document.getElementById('avol-val').textContent=this.value+'%'" />

      <div class="row">
        <button class="btn sec" onclick="presetLofi()">🌙 Slowed Lo-Fi (0.85x)</button>
        <button class="btn sec" onclick="presetNightcore()">⚡ Fast 1.25x</button>
      </div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="renderProcessedAudio()">🎧 Render & Export HD Audio</button>
      <div id="afx-stat" class="info"></div>
    </div>
  </div>

  <!-- 6. HD FRAME & INFO -->
  <div id="tab-info" class="card hidden">
    <label class="upload-box">
      📸 <b>Video / Audio File chunein (Upgraded ⚡)</b>
      <span>Capture Full-HD Photo Frame at any second + Media Resolution Info</span>
      <input type="file" accept="video/*,audio/*" onchange="inspectMedia(event)" />
    </label>
    <div id="info-ui" class="hidden">
      <div class="media-box"><video id="info-vid" controls playsinline></video></div>
      <div id="info-text" class="info"></div>
      <button class="btn green" style="width:100%;margin-top:10px" onclick="grabVideoFrame()">📸 Capture Full-HD Photo Frame</button>
    </div>
  </div>

  <script>
    let lastBlob = null, lastFilename = 'solvrik_media.bin', lastObjUrl = '', currentYtId = '';

    window.addEventListener('DOMContentLoaded', () => {
      if (window.Telegram?.WebApp) {
        try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
      }
      const qp = new URLSearchParams(window.location.search).get('url');
      if (qp) {
        document.getElementById('yt-url').value = qp;
        fetchYtStreams();
      }
    });

    function switchTab(id, btn) {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      ['yt', 'aud', 'trim', 'vcrop', 'afx', 'info'].forEach(t => document.getElementById('tab-' + t).classList.toggle('hidden', t !== id));
    }

    function setOutput(blob, filename, htmlPreview) {
      if (!blob) return;
      lastBlob = blob;
      lastFilename = filename;
      lastObjUrl = URL.createObjectURL(blob);
      const szTxt = blob.size >= 1024 * 1024
        ? (blob.size / (1024 * 1024)).toFixed(2) + ' MB'
        : (blob.size / 1024).toFixed(1) + ' KB';
      document.getElementById('out-title').textContent = `✅ Ready: ${filename} (${szTxt})`;
      document.getElementById('out-preview').innerHTML = htmlPreview || '';
      const box = document.getElementById('out-box');
      box.classList.remove('hidden');
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function smartSaveAction() {
      if (!lastBlob) return;
      try {
        const f = new File([lastBlob], lastFilename, { type: lastBlob.type || 'application/octet-stream' });
        if (navigator.canShare && navigator.canShare({ files: [f] })) {
          await navigator.share({ files: [f], title: lastFilename });
          return;
        }
      } catch (e) {}
      try {
        const a = document.createElement('a');
        a.href = lastObjUrl || URL.createObjectURL(lastBlob);
        a.download = lastFilename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => a.remove(), 250);
      } catch (e) {}
      openFileTab();
    }

    function openFileTab() {
      if (!lastBlob) return;
      window.open(lastObjUrl || URL.createObjectURL(lastBlob), '_blank');
    }

    function extractYtId(url) {
      const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    async function pasteYtUrl() {
      try {
        const txt = await navigator.clipboard.readText();
        if (txt) { document.getElementById('yt-url').value = txt.trim(); fetchYtStreams(); }
      } catch (e) {
        document.getElementById('yt-stat').textContent = '📋 Box par tap karke Paste dabayein.';
      }
    }

    function onYtInput() {
      const val = document.getElementById('yt-url').value.trim();
      if (extractYtId(val)) fetchYtStreams();
    }

    function openInYouTube() {
      if (!currentYtId) return;
      window.open(`https://www.youtube.com/watch?v=${currentYtId}`, '_blank');
    }

    async function fetchYtStreams() {
      const rawUrl = document.getElementById('yt-url').value.trim();
      const vid = extractYtId(rawUrl);
      const stat = document.getElementById('yt-stat');
      const resCard = document.getElementById('yt-result');
      const playerWrap = document.getElementById('yt-player-wrap');
      const player = document.getElementById('yt-direct-player');

      if (!vid) {
        stat.textContent = '❌ Sahi YouTube Video ya Shorts link paste karein!';
        resCard.classList.add('hidden');
        return;
      }

      currentYtId = vid;
      const cleanYt = `https://www.youtube.com/watch?v=${vid}`;
      stat.textContent = '⏳ Video details & streams check ho rahe hain...';
      resCard.classList.remove('hidden');
      playerWrap.classList.add('hidden');
      document.getElementById('yt-thumb-prev').src = `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
      document.getElementById('yt-meta-title').textContent = `YouTube Video (${vid})`;

      fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(cleanYt)}&format=json`)
        .then(r => r.json())
        .then(d => { if (d.title) document.getElementById('yt-meta-title').textContent = d.title; })
        .catch(() => {});

      const streamBox = document.getElementById('yt-stream-btns');
      streamBox.innerHTML = '';

      let foundStreams = [];
      const pipedApis = [
        'https://pipedapi.kavin.rocks',
        'https://pipedapi.adminforge.de',
        'https://api.piped.yt'
      ];
      for (const api of pipedApis) {
        if (foundStreams.length) break;
        try {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 3500);
          const resp = await fetch(`${api}/streams/${vid}`, { signal: ctrl.signal });
          clearTimeout(tid);
          if (!resp.ok) continue;
          const data = await resp.json();
          if (data.title) document.getElementById('yt-meta-title').textContent = data.title;
          (data.videoStreams || []).filter(s => !s.videoOnly && s.url).forEach(s => {
            foundStreams.push({ label: `🎬 Direct ${s.quality || 'MP4'} Video`, url: s.url, isVideo: true });
          });
          const audios = (data.audioStreams || []).filter(s => s.url).sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
          if (audios.length) {
            foundStreams.push({ label: `🎵 Direct Audio (${Math.round((audios[0].bitrate || 128000) / 1000)} kbps)`, url: audios[0].url, isVideo: false });
          }
        } catch (e) {}
      }

      if (foundStreams.length) {
        const firstVid = foundStreams.find(x => x.isVideo);
        if (firstVid) {
          player.src = firstVid.url;
          playerWrap.classList.remove('hidden');
        }
        foundStreams.slice(0, 4).forEach(item => {
          const btn = document.createElement('a');
          btn.className = item.isVideo ? 'btn green' : 'btn';
          btn.href = item.url;
          btn.target = '_blank';
          btn.rel = 'noopener';
          btn.download = `solvrik_${vid}.${item.isVideo ? 'mp4' : 'm4a'}`;
          btn.textContent = item.label;
          streamBox.appendChild(btn);
        });
        stat.textContent = '✅ Direct Streams Ready! Niche button se save karein:';
      } else {
        stat.textContent = '✅ Video Loaded! Direct MP4/MP3 download ke liye Solvrik App use karein ya 1080p Thumbnail save karein:';
      }
    }

    async function grabYtThumb(vidId) {
      if (!vidId) return;
      const stat = document.getElementById('yt-stat');
      stat.textContent = '⏳ 1080p Thumbnail fetch ho raha hai...';
      try {
        let resp = await fetch(`https://i.ytimg.com/vi/${vidId}/maxresdefault.jpg`);
        if (!resp.ok) resp = await fetch(`https://i.ytimg.com/vi/${vidId}/hqdefault.jpg`);
        const blob = await resp.blob();
        stat.textContent = '✅ HD Thumbnail Ready!';
        setOutput(blob, `yt_thumb_${vidId}.jpg`, `<img src="${URL.createObjectURL(blob)}" style="max-height:220px"/>`);
      } catch (e) { stat.textContent = '❌ Thumbnail fetch error.'; }
    }

    function audioBufferToWav(buffer) {
      const numCh = Math.min(2, buffer.numberOfChannels), rate = buffer.sampleRate;
      const len = buffer.length * numCh * 2 + 44;
      const out = new ArrayBuffer(len), view = new DataView(out);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF'); view.setUint32(4, len - 8, true); writeStr(8, 'WAVE');
      writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, numCh, true); view.setUint32(24, rate, true);
      view.setUint32(28, rate * numCh * 2, true); view.setUint16(32, numCh * 2, true);
      view.setUint16(34, 16, true); writeStr(36, 'data'); view.setUint32(40, len - 44, true);
      let offset = 44;
      for (let i = 0; i < buffer.length; i++) {
        for (let ch = 0; ch < numCh; ch++) {
          let s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          offset += 2;
        }
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    let audFile = null;
    function loadAudVid(e) {
      const f = e.target.files[0]; if (!f) return;
      audFile = f;
      document.getElementById('aud-vid').src = URL.createObjectURL(f);
      document.getElementById('aud-ui').classList.remove('hidden');
      document.getElementById('aud-stat').textContent = `📁 ${f.name} (${(f.size / (1024 * 1024)).toFixed(2)} MB)`;
    }
    async function extractAudioNow() {
      if (!audFile) return;
      const stat = document.getElementById('aud-stat');
      stat.textContent = '⏳ High-Quality Audio decode ho raha hai...';
      try {
        const arrBuf = await audFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await audioCtx.decodeAudioData(arrBuf);
        const wavBlob = audioBufferToWav(decoded);
        stat.textContent = '✅ Audio extract ho gaya!';
        setOutput(wavBlob, 'solvrik_extracted_audio.wav', `<audio controls src="${URL.createObjectURL(wavBlob)}" style="width:100%"></audio>`);
      } catch (err) {
        stat.textContent = '❌ Is codec ka direct decode supported nahi hai — Bot ka Video → MP3 tool use karein.';
      }
    }

    function loadTrimVid(e) {
      const f = e.target.files[0]; if (!f) return;
      const v = document.getElementById('trim-vid');
      v.src = URL.createObjectURL(f);
      v.onloadedmetadata = () => {
        document.getElementById('t-start').value = 0;
        document.getElementById('t-end').value = Math.min(30, Math.floor(v.duration || 15));
      };
      document.getElementById('trim-ui').classList.remove('hidden');
    }
    async function processTrimCompress() {
      const v = document.getElementById('trim-vid');
      if (!v.src) return;
      const start = Math.max(0, parseFloat(document.getElementById('t-start').value) || 0);
      const end = Math.min(v.duration || 30, Math.max(start + 1, parseFloat(document.getElementById('t-end').value) || 15));
      const scale = parseFloat(document.getElementById('trim-q').value) || 0.75;
      const mute = document.getElementById('trim-mute').value === 'mute';
      const stat = document.getElementById('trim-stat');

      const c = document.createElement('canvas');
      c.width = Math.max(240, Math.round(v.videoWidth * scale));
      c.height = Math.max(240, Math.round(v.videoHeight * scale));
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

      const stream = c.captureStream(25);
      if (!mute) {
        try {
          const vs = v.captureStream ? v.captureStream() : (v.mozCaptureStream ? v.mozCaptureStream() : null);
          if (vs) vs.getAudioTracks().forEach(t => stream.addTrack(t));
        } catch (e) {}
      }

      const chunks = [];
      const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        stat.textContent = '✅ Video Trim & Compress Ready!';
        setOutput(blob, 'solvrik_trimmed.webm', `<video controls src="${URL.createObjectURL(blob)}" style="max-height:220px"></video>`);
      };

      v.currentTime = start;
      await new Promise(r => { v.onseeked = r; });
      stat.textContent = `⏳ Processing clip (${start}s → ${end}s)...`;
      rec.start(); v.play();
      const loop = () => {
        if (v.currentTime >= end || v.paused || v.ended) { v.pause(); if (rec.state !== 'inactive') rec.stop(); return; }
        ctx.drawImage(v, 0, 0, c.width, c.height);
        requestAnimationFrame(loop);
      };
      loop();
    }

    let selectedVidRatio = 'orig';
    function loadCropVid(e) {
      const f = e.target.files[0]; if (!f) return;
      document.getElementById('vcrop-vid').src = URL.createObjectURL(f);
      document.getElementById('vcrop-ui').classList.remove('hidden');
    }
    function setVidRatio(r, el) {
      selectedVidRatio = r;
      document.querySelectorAll('#tab-vcrop .pill').forEach(p => p.classList.remove('on'));
      el.classList.add('on');
    }
    async function exportRatioSpeedVideo() {
      const v = document.getElementById('vcrop-vid');
      if (!v.src || !v.videoWidth) return;
      const spd = parseFloat(document.getElementById('vspd-slider').value) || 1.0;
      const stat = document.getElementById('vcrop-stat');

      let sx = 0, sy = 0, sw = v.videoWidth, sh = v.videoHeight;
      if (selectedVidRatio !== 'orig') {
        const [rw, rh] = selectedVidRatio.split(':').map(Number);
        const tr = rw / rh, cr = sw / sh;
        if (cr > tr) { sw = Math.round(sh * tr); sx = Math.round((v.videoWidth - sw) / 2); }
        else { sh = Math.round(sw / tr); sy = Math.round((v.videoHeight - sh) / 2); }
      }
      const scale = Math.min(1, 720 / Math.max(sw, sh));
      const c = document.createElement('canvas');
      c.width = Math.round(sw * scale); c.height = Math.round(sh * scale);
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

      const stream = c.captureStream(25);
      const chunks = [];
      const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
      rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      rec.onstop = () => {
        v.playbackRate = 1.0;
        const blob = new Blob(chunks, { type: 'video/webm' });
        stat.textContent = '✅ Ratio & Speed Video Ready!';
        setOutput(blob, 'solvrik_ratio_speed.webm', `<video controls src="${URL.createObjectURL(blob)}" style="max-height:220px"></video>`);
      };

      v.currentTime = 0;
      await new Promise(r => { v.onseeked = r; });
      v.playbackRate = spd;
      stat.textContent = `⏳ Rendering (${selectedVidRatio}, ${spd}x)...`;
      rec.start(); v.play();
      const loop = () => {
        if (v.paused || v.ended) { if (rec.state !== 'inactive') rec.stop(); return; }
        ctx.drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
        requestAnimationFrame(loop);
      };
      loop();
    }

    let afxFile = null;
    function loadAudioFx(e) {
      const f = e.target.files[0]; if (!f) return;
      afxFile = f;
      document.getElementById('afx-ui').classList.remove('hidden');
      document.getElementById('afx-name').textContent = `🎵 Loaded: ${f.name}`;
    }
    function presetLofi() {
      document.getElementById('aspd-slider').value = 0.85;
      document.getElementById('aspd-val').textContent = '0.85x';
    }
    function presetNightcore() {
      document.getElementById('aspd-slider').value = 1.25;
      document.getElementById('aspd-val').textContent = '1.25x';
    }
    async function renderProcessedAudio() {
      if (!afxFile) return;
      const spd = parseFloat(document.getElementById('aspd-slider').value) || 1.0;
      const vol = (parseFloat(document.getElementById('avol-slider').value) || 100) / 100.0;
      const stat = document.getElementById('afx-stat');
      stat.textContent = '⏳ Rendering HD Audio...';
      try {
        const arrBuf = await afxFile.arrayBuffer();
        const actx = new (window.AudioContext || window.webkitAudioContext)();
        const decoded = await actx.decodeAudioData(arrBuf);
        const outLen = Math.ceil(decoded.length / spd);
        const offline = new OfflineAudioContext(decoded.numberOfChannels, outLen, decoded.sampleRate);
        const src = offline.createBufferSource();
        src.buffer = decoded;
        src.playbackRate.value = spd;
        const gain = offline.createGain();
        gain.gain.value = vol;
        src.connect(gain);
        gain.connect(offline.destination);
        src.start(0);
        const rendered = await offline.startRendering();
        const wavBlob = audioBufferToWav(rendered);
        stat.textContent = `✅ Ready (${spd}x, ${Math.round(vol * 100)}% vol)!`;
        setOutput(wavBlob, `solvrik_audio_${spd}x.wav`, `<audio controls src="${URL.createObjectURL(wavBlob)}" style="width:100%"></audio>`);
      } catch (err) {
        stat.textContent = '❌ Audio decode error — MP3 ya WAV file chunein.';
      }
    }

    function inspectMedia(e) {
      const f = e.target.files[0]; if (!f) return;
      const v = document.getElementById('info-vid');
      v.src = URL.createObjectURL(f);
      document.getElementById('info-ui').classList.remove('hidden');
      v.onloadedmetadata = () => {
        const mb = (f.size / (1024 * 1024)).toFixed(2);
        document.getElementById('info-text').innerHTML =
          `📁 File: ${f.name}<br>📐 Resolution: ${v.videoWidth || '-'} × ${v.videoHeight || '-'} px<br>⏱️ Duration: ${(v.duration || 0).toFixed(1)} sec | 📦 Size: ${mb} MB`;
      };
    }
    function grabVideoFrame() {
      const v = document.getElementById('info-vid');
      if (!v.videoWidth) return;
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      c.toBlob(b => setOutput(b, 'video_frame_hd.jpg', `<img src="${URL.createObjectURL(b)}" style="max-height:220px"/>`), 'image/jpeg', 0.97);
    }
  </script>
</body>
